<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROAD TO NFL</title><style>body{margin:0;background:#07090d;color:#fff;font-family:system-ui,Arial;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:28px 18px}h1{font-size:42px;margin:5px 0}.card{background:#111722;border:1px solid #293242;border-radius:18px;padding:22px;margin-top:18px}.hidden{display:none}.muted{color:#9ca6b5}.btn,.choice{padding:14px;border-radius:10px;font-weight:800;cursor:pointer}.btn{border:0;background:#ff5b22;color:#fff;margin-top:18px}.choice{display:block;width:100%;margin:10px 0;border:1px solid #303b4d;background:#171e29;color:#fff;text-align:left}.choice:hover{border-color:#ff5b22}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{background:#090c11;border:1px solid #252e3c;border-radius:10px;padding:12px}.stat b{display:block;font-size:19px}.event{margin-top:18px}.tag{color:#ff7b45;font-size:12px;font-weight:900}.success{padding:14px;border-radius:10px;background:#102117;color:#b8e7c5;margin-top:14px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:34px}}</style></head><body><div class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><p class="muted">Construis ta carrière. Chaque décision compte.</p><div id="creator" class="card"><h2>Créer ton joueur</h2><label>Prénom</label><input id="first" value="Jayden" style="width:100%;box-sizing:border-box;padding:13px;background:#080b10;color:#fff;border:1px solid #303b4d;border-radius:9px"><label>Nom</label><input id="last" value="Carter" style="width:100%;box-sizing:border-box;padding:13px;background:#080b10;color:#fff;border:1px solid #303b4d;border-radius:9px"><label>Ethnie / apparence</label><select id="eth" style="width:100%;padding:13px;background:#080b10;color:#fff;border:1px solid #303b4d;border-radius:9px"><option>Afro-américaine</option><option>Européenne</option><option>Latino-américaine</option><option>Asiatique</option><option>Arabe / moyen-orientale</option><option>Métisse</option><option>Autre</option></select><label>Poste</label><select id="pos" style="width:100%;padding:13px;background:#080b10;color:#fff;border:1px solid #303b4d;border-radius:9px"><option>Quarterback</option><option>Running Back</option><option>Wide Receiver</option><option>Cornerback</option><option>Linebacker</option><option>Defensive End</option><option>Offensive Lineman</option><option>Kicker</option></select><button class="btn" onclick="createPlayer()">Valider mon joueur</button></div><div id="career" class="hidden"><div class="card"><h2 id="welcome"></h2><p id="season" class="muted"></p><div class="stats"><div class="stat"><b id="fans">1200</b><small>Fans</small></div><div class="stat"><b id="rep">50</b><small>Réputation</small></div><div class="stat"><b id="conf">70</b><small>Confiance</small></div><div class="stat"><b id="coach">60</b><small>Coach</small></div><div class="stat"><b id="wins">0</b><small>Victoires</small></div></div></div><div id="match" class="card event"><span class="tag" id="tag"></span><h2 id="title"></h2><p id="text" class="muted"></p><div id="choices"></div></div><div id="interview" class="card hidden"><span class="tag">🎙️ INTERVIEW</span><h2>Après le match</h2><p id="question"></p><div id="answers"></div></div><div id="continue" class="card hidden"><h2 id="nextTitle"></h2><p id="nextText" class="muted"></p><button class="btn" onclick="nextMatch()">Continuer ma carrière →</button></div></div></div><script>let player=null,eventIndex=0,matchNo=1,score=0,opponentScore=0,stats={fans:1200,rep:50,conf:70,coach:60,wins:0};const matchEvents=[{tag:'ÉVÉNEMENT 1 / 3',title:'Premier drive',text:'La défense adverse joue très haut. Ton équipe compte sur toi.',choices:[['Passe profonde',7,0,6,3],['Passe courte',3,0,3,5],['Course improvisée',4,0,4,3]]},{tag:'ÉVÉNEMENT 2 / 3',title:'Le provocateur',text:'Un défenseur te provoque devant les caméras. Que fais-tu ?',choices:[['Ignorer',0,0,5,5],['Répondre',2,0,7,-2],['Le défier',7,0,6,-5]]},{tag:'ÉVÉNEMENT 3 / 3',title:'Le drive décisif',text:'Il reste 20 secondes. Ton équipe est menée 24-21. Le coach te dit : « C’est ton moment. »',choices:[['Passe longue',7,0,10,8],['Jeu sécurisé',3,3,3,4],['Tenter l’impossible',10,0,8,-3]]}];function createPlayer(){player={first:document.getElementById('first').value.trim()||'Jayden',last:document.getElementById('last').value.trim()||'Carter',eth:document.getElementById('eth').value,pos:document.getElementById('pos').value};localStorage.setItem('roadToNFLPlayer',JSON.stringify(player));document.getElementById('creator').classList.add('hidden');document.getElementById('career').classList.remove('hidden');document.getElementById('welcome').textContent=player.first+' '+player.last+' · '+player.pos;startMatch()}function startMatch(){eventIndex=0;score=0;opponentScore=0;document.getElementById('match').classList.remove('hidden');document.getElementById('interview').classList.add('hidden');document.getElementById('continue').classList.add('hidden');document.getElementById('season').textContent='Saison High School · Match '+matchNo+' · Semaine '+matchNo;renderEvent()}function renderEvent(){let e=matchEvents[eventIndex];document.getElementById('tag').textContent=e.tag;document.getElementById('title').textContent=e.title;document.getElementById('text').textContent=e.text;let box=document.getElementById('choices');box.innerHTML='';e.choices.forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c[0];b.onclick=()=>choose(c);box.appendChild(b)})}function choose(c){score+=c[1];opponentScore+=c[2];stats.fans+=c[1]*150;stats.rep+=c[1];stats.conf+=c[3];stats.coach+=c[4];updateStats();eventIndex++;if(eventIndex<matchEvents.length)renderEvent();else finishMatch()}function finishMatch(){let win=score>=14||score>opponentScore; if(win)stats.wins++;document.getElementById('tag').textContent='FIN DU MATCH';document.getElementById('title').textContent=win?'🏆 VICTOIRE !':'😬 DÉFAITE';document.getElementById('text').textContent='Performance : '+score+' · Score du match : '+(win?'28':'21')+' - '+(win?'24':'28')+'. Les journalistes arrivent.';document.getElementById('choices').innerHTML='';document.getElementById('interview').classList.remove('hidden');document.getElementById('question').textContent=win?'« Tu viens de gagner. Quel message pour les fans ? »':'« Ton équipe vient de perdre. Comment vas-tu réagir ? »';let a=document.getElementById('answers');a.innerHTML='';[['Rendre hommage à l’équipe',8,6],['Assumer le rôle de star',12,2],['Rester humble',6,7]].forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x[0];b.onclick=()=>answerInterview(b,x)});Array.from(a.children).forEach(()=>{});[['Rendre hommage à l’équipe',8,6],['Assumer le rôle de star',12,2],['Rester humble',6,7]].forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x[0];b.onclick=()=>answerInterview(b,x);a.appendChild(b)});document.getElementById('match').scrollIntoView({behavior:'smooth'})}function answerInterview(b,x){stats.rep+=x[1];stats.fans+=x[1]*100;stats.coach+=x[2];updateStats();document.querySelectorAll('#answers .choice').forEach(z=>z.disabled=true);b.textContent='✓ '+b.textContent;document.getElementById('nextTitle').textContent='📅 Semaine suivante';document.getElementById('nextText').textContent='Ton match est terminé. Ton coach prépare déjà la prochaine rencontre. Ta carrière continue.';document.getElementById('continue').classList.remove('hidden');document.getElementById('continue').scrollIntoView({behavior:'smooth'})}function nextMatch(){matchNo++;if(matchNo===5){document.getElementById('nextTitle').textContent='🏆 Fin de saison';document.getElementById('nextText').textContent='Tu as terminé la saison High School. Ta réputation attire maintenant des recruteurs universitaires. Une nouvelle étape de ta carrière est disponible !';document.getElementById('continue').innerHTML='<h2>🏆 Fin de saison</h2><p class="muted">Tes performances ont attiré l’attention. La prochaine étape sera le recrutement College.</p><button class="btn" onclick="newSeason()">Découvrir les offres College →</button>';return}startMatch()}function newSeason(){matchNo=1;document.getElementById('season').textContent='Recrutement College · Prochaine étape';document.getElementById('nextTitle').textContent='🎓 Recrutement';document.getElementById('nextText').textContent='Plusieurs universités commencent à suivre ton profil. Le système College sera disponible dans la prochaine étape de Road to NFL.';updateStats()}function updateStats(){['fans','rep','conf','coach','wins'].forEach(k=>document.getElementById(k).textContent=stats[k].toLocaleString('fr-FR'))}try{let p=JSON.parse(localStorage.getItem('roadToNFLPlayer'));if(p){document.getElementById('first').value=p.first||'Jayden';document.getElementById('last').value=p.last||'Carter';document.getElementById('eth').value=p.eth||document.getElementById('eth').value;document.getElementById('pos').value=p.pos||document.getElementById('pos').value}}catch(e){}</script></body></html>
