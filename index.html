<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to NFL</title><style>body{margin:0;background:#07090d;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:#121823;border:1px solid #293342;border-radius:18px;padding:20px;margin:14px 0}.hidden{display:none!important}.btn,.choice{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border:0;border-radius:10px;background:#ff5b22;color:white;font-weight:700;font-size:16px;cursor:pointer}.choice{background:#202936;text-align:left}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#090c11;padding:12px;border-radius:10px}.stat b{font-size:19px}.good,.bad{padding:16px;border-radius:11px;margin:10px 0}.good{background:#123b24;border:1px solid #28c76f;color:#b2ffc9}.bad{background:#40171b;border:1px solid #ff4d5f;color:#ffabb3}.eventtag{display:inline-block;padding:5px 9px;border-radius:20px;background:#283242;color:#cbd4df;font-size:12px}.bar{height:10px;background:#252d39;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#ff5b22}.choice:disabled{opacity:.45;cursor:not-allowed}@media(max-width:650px){.grid,.stats{grid-template-columns:1fr 1fr}}h1{font-size:38px}.muted{color:#aeb8c7}</style></head><body><main class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><section id="creator" class="card"><h2>Créer ton joueur</h2><input id="first" value="Jayden" placeholder="Prénom" style="width:100%;box-sizing:border-box;padding:13px"><br><br><input id="last" value="Carter" placeholder="Nom" style="width:100%;box-sizing:border-box;padding:13px"><p>Taille : <b id="hv">1,80 m</b></p><input id="height" type="range" min="170" max="200" value="180" style="width:100%"><p>Poids : <b id="wv">85 kg</b></p><input id="weight" type="range" min="60" max="150" value="85" style="width:100%"><select id="pos" style="width:100%;padding:13px"><option>Quarterback</option><option>Running Back</option><option>Wide Receiver</option><option>Cornerback</option><option>Linebacker</option><option>Defensive End</option><option>Offensive Lineman</option><option>Kicker</option></select><select id="city" style="width:100%;padding:13px;margin-top:10px"><option>New York</option><option>Los Angeles</option><option>Miami</option><option>Dallas</option><option>Atlanta</option><option>Chicago</option><option>Houston</option><option>Seattle</option></select><select id="school" style="width:100%;padding:13px;margin-top:10px"><option>Lincoln High School</option><option>Central High School</option><option>Westside High School</option><option>Eastview High School</option><option>Northside High School</option></select><button id="start" class="btn">Valider mon joueur</button></section><section id="career" class="hidden"><div class="card"><h2 id="player"></h2><p id="mini"></p><button id="statsBtn" class="choice">📊 Voir mes statistiques</button><div id="stats" class="hidden"><p id="profile"></p><p id="coachNote"></p><div class="stats"><div class="stat">Fans<br><b id="fans">1200</b></div><div class="stat">Réputation<br><b id="rep">50</b></div><div class="stat">Confiance<br><b id="conf">70</b></div><div class="stat">Coach<br><b id="coach">60</b></div></div><p>Fatigue</p><div class="bar"><i id="fatbar" style="width:0%"></i></div></div></div><div id="hub" class="card"><h2>Carrière · Vie privée</h2><p id="date"></p><p id="status"></p><div class="grid"><button id="train" class="choice">🏋️ Entraînement</button><button id="live" class="choice">📱 Livestream</button><button id="party" class="choice">🎉 Soirée</button><button id="vacation" class="choice">✈️ Vacances</button><button id="dating" class="choice hidden">❤️ Rencard</button><button id="gear" class="choice">👟 Équipement</button><button id="match" class="choice">🏈 Jouer un match</button><button id="offers" class="choice">🎓 Universités</button><button id="draft" class="choice hidden">🏆 Draft NFL</button></div><button id="next" class="btn">📅 +1 MOIS</button></div><div id="panel" class="card hidden"></div></section></main><script>"use strict";const $=id=>document.getElementById(id);let state={age:16,month:1,activities:0,fatigue:0,fans:1200,rep:50,conf:70,coach:60,gf:false,player:null,seen:new Set(),equipment:{helmet:'Riddell SpeedFlex',cleats:'Nike Alpha Menace',gloves:'Nike Vapor Jet',pads:'Riddell',ball:'Wilson The Duke'}};function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}function update(){if(!state.player)return;$('fans').textContent=state.fans.toLocaleString('fr-FR');$('rep').textContent=state.rep;$('conf').textContent=state.conf;$('coach').textContent=state.coach;$('fatbar').style.width=state.fatigue+'%';$('date').textContent='Âge '+state.age+' ans · Mois '+state.month;$('status').textContent=(3-state.activities)+' activité(s) restante(s) · Fatigue '+state.fatigue+'/100';$('dating').classList.toggle('hidden',!state.gf);$('draft').classList.toggle('hidden',state.age<21)}function hub(){hide('panel');show('hub');update()}function use(){if(state.activities>=3){alert('Tu as utilisé tes 3 activités ce mois-ci. Passe au mois suivant.');return false}state.activities++;return true}function result(ok,title,text){hide('hub');show('panel');$('panel').innerHTML='<span class="eventtag">'+(ok?'CONSÉQUENCE POSITIVE':'CONSÉQUENCE NÉGATIVE')+'</span><h2>'+title+'</h2><div class="'+(ok?'good':'bad')+'"><b>'+(ok?'✓ Bon choix':'✕ Mauvais choix')+'</b><br>'+text+'</div><button id="back" class="btn">Continuer</button>';$('back').onclick=hub;update()}$('height').oninput=()=>{$('hv').textContent=(+$('height').value/100).toFixed(2).replace('.',',')+' m'};$('weight').oninput=()=>{$('wv').textContent=$('weight').value+' kg'};$('start').onclick=()=>{let h=+$('height').value,w=+$('weight').value;state.player={first:$('first').value.trim()||'Jayden',last:$('last').value.trim()||'Carter',height:h,weight:w,pos:$('pos').value,city:$('city').value,school:$('school').value};$('player').textContent=state.player.first+' '+state.player.last;$('mini').textContent=(h/100).toFixed(2).replace('.',',')+' m · '+w+' kg · '+state.player.pos;$('profile').textContent=state.player.city+' · '+state.player.school+' · '+state.player.pos+' · '+(h/100).toFixed(2)+' m · '+w+' kg';let ideals={Quarterback:185,'Running Back':178,'Wide Receiver':183,Cornerback:180,Linebacker:188,'Defensive End':193,'Offensive Lineman':193,Kicker:180},ideal=ideals[state.player.pos];let good=Math.abs(h-ideal)<=5;state.coach+=good?5:-3;$('coachNote').textContent=good?'Le coach estime que ton gabarit correspond bien à ton poste.':'Le coach trouve ton gabarit atypique pour ce poste. Tu devras compenser avec ta technique.';hide('creator');show('career');hub()};$('statsBtn').onclick=()=>{$('stats').classList.toggle('hidden')};$('train').onclick=()=>{if(!use())return;hide('hub');show('panel');$('panel').innerHTML='<h2>🏋️ Entraînement</h2><p>Choisis une séance.</p><button class="choice tr">💪 Musculation</button><button class="choice tr">🫀 Cardio</button><button class="choice tr">🏃 Tapis de course</button><button class="choice tr">🏈 Exercices de lancer</button><button class="choice tr">⚡ Agilité</button>';document.querySelectorAll('.tr').forEach(b=>b.onclick=()=>{let n=b.textContent;state.fatigue=Math.min(100,state.fatigue+(n.includes('Musculation')?11:7));state.conf+=5;state.rep+=3;result(true,n,'Bonne séance. Ta progression augmente, mais ta fatigue atteint '+state.fatigue+'/100.');})};$('live').onclick=()=>{if(!use())return;hide('hub');show('panel');$('panel').innerHTML='<h2>📱 Livestream</h2><button class="choice lv">🎮 Live gaming</button><button class="choice lv">💬 Just Chatting</button><button class="choice lv">🏈 Analyse football</button><button class="choice lv">🔥 Défi sportif</button><button class="choice lv">⭐ Apparition dans le live d’un streamer connu</button>';document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{state.rep+=6;state.fans+=500;result(true,b.textContent,'Le public accroche à ton contenu. Ta visibilité progresse et de nouveaux fans te suivent.');})};$('party').onclick=()=>{if(!use())return;state.fans+=250;state.rep+=3;state.fatigue=Math.min(100,state.fatigue+4);result(true,'🎉 Soirée','Tu rencontres plusieurs personnes du milieu sportif. Tu gagnes en visibilité, mais tu rentres plus tard que prévu.')};$('vacation').onclick=()=>{if(!use())return;state.fatigue=Math.max(0,state.fatigue-22);state.conf+=5;result(true,'✈️ Vacances','Tu coupes avec le football quelques jours. Ton corps récupère et ta confiance remonte.')};$('dating').onclick=()=>{if(!state.gf)return;if(!use())return;state.conf+=7;result(true,'❤️ Rendez-vous','Vous passez un bon moment ensemble. Ta relation devient plus solide.')};$('match').onclick=()=>{if(!use())return;let p=Math.max(1,18-(state.fatigue>=75?6:0));state.rep+=p>=14?8:2;state.fans+=p>=14?700:150;state.coach+=p>=14?5:-3;state.fatigue=Math.min(100,state.fatigue+8);result(p>=14,'🏈 Match terminé',p>=14?'Très bonne performance. Les recruteurs commencent à remarquer ta régularité.':'Tu as eu du mal aujourd’hui. La fatigue a pesé sur tes décisions et ton explosivité.');};$('offers').onclick=()=>{hide('hub');show('panel');let n=state.age<18?'Les recruteurs commencent seulement à suivre ton profil. Continue à jouer.':state.rep>=90?'Plusieurs universités surveillent tes performances.':'Tu dois encore augmenter ta réputation pour attirer les meilleurs programmes.';$('panel').innerHTML='<h2>🎓 Universités</h2><p>'+n+'</p><button class="btn" id="b">Retour</button>';$('b').onclick=hub};$('draft').onclick=()=>{hide('hub');show('panel');let ready=state.age>=21&&state.rep>=140&&state.coach>=90;$('panel').innerHTML='<h2>🏆 Draft NFL</h2><p>'+(ready?'Les scouts NFL te considèrent comme un prospect sérieux.':'Tu n’es pas encore prêt. Il te faut plus de réputation et la confiance des coaches.')+'</p><button class="btn" id="b">Retour</button>';$('b').onclick=hub};$('gear').onclick=()=>{hide('hub');show('panel');$('panel').innerHTML='<h2>👟 Équipement</h2><p>Avant les sponsors, tu choisis librement ton matériel.</p><button class="choice" onclick="equip(\'helmet\',\'Riddell SpeedFlex\')">🪖 Riddell SpeedFlex</button><button class="choice" onclick="equip(\'helmet\',\'Schutt F7 AiR\')">🪖 Schutt F7 AiR</button><button class="choice" onclick="equip(\'cleats\',\'Nike Alpha Menace\')">👟 Nike Alpha Menace</button><button class="choice" onclick="equip(\'cleats\',\'adidas Adizero\')">👟 adidas Adizero</button><button class="choice" onclick="equip(\'gloves\',\'Nike Vapor Jet\')">🧤 Nike Vapor Jet</button><button class="choice" onclick="equip(\'gloves\',\'Cutters REV PRO\')">🧤 Cutters REV PRO</button><button class="btn" onclick="hub()">Retour</button>'};function equip(t,n){state.equipment[t]=n;result(true,'Équipement équipé',n+' est maintenant ton équipement principal pour cette catégorie.')}

function randomEvent(){hide('hub');show('panel');let available=events.filter((_,i)=>!state.seen.has(i));if(!available.length){state.seen.clear();available=events}let picked=available[Math.floor(Math.random()*available.length)],idx=events.indexOf(picked);state.seen.add(idx);let [tag,title,choices,effects,good,bad]=picked;let a=Math.random()<0.5?0:1;$('panel').innerHTML='<span class="eventtag">'+tag+'</span><h2>'+title+'</h2><p>'+picked[0]+' · '+picked[1]+'</p><p class="muted">Une situation de ta vie apparaît ce mois-ci. Tes choix peuvent influencer ta carrière.</p><button class="choice" id="c1">'+choices[0]+'</button><button class="choice" id="c2">'+choices[1]+'</button>';$('c1').onclick=()=>choose(true,effects[0],good);$('c2').onclick=()=>choose(false,effects[1],bad)}function choose(isGood,effect,text){state.rep+=effect;state.conf+=isGood?4:-4;state.fans+=isGood?120:20;if(effect<0)state.coach=Math.max(0,state.coach-3);result(isGood,isGood?'Bonne décision':'Mauvaise décision',text+' Impact : '+(effect>=0?'+':'')+effect+' réputation. '+(isGood?'Tu renforces progressivement ton image et ta progression.':'Cette décision te coûte quelque chose. Tu devras te rattraper.') )}$('next').onclick=()=>{state.month++;state.activities=0;state.fatigue=Math.max(0,state.fatigue-18);if(state.month>12){state.month=1;state.age++;if(state.age>=18)state.rep+=2}update();randomEvent()};</script></body></html>
