<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to NFL</title><style>body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#121823;border:1px solid #293342;border-radius:16px;padding:18px;margin:14px 0}.hide{display:none!important}.btn,.choice{display:block;width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:0;border-radius:9px;background:#ff5b22;color:#fff;font-weight:bold;cursor:pointer}.choice{text-align:left;background:#202936}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stat{background:#090c11;padding:9px;border-radius:8px}.stat b{display:block;font-size:18px}.good{background:#123b24;border:1px solid #28c76f;color:#a5ffc3;padding:13px;border-radius:9px}.bad{background:#40171b;border:1px solid #ff4d5f;color:#ff9aa5;padding:13px;border-radius:9px}.profileHead{cursor:pointer}input,select{font-size:16px;padding:12px;box-sizing:border-box;width:100%;margin:6px 0}label{display:block;margin-top:10px}@media(max-width:650px){.grid,.stats{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><section id="creator" class="card"><h2>Créer ton joueur</h2><input id="first" placeholder="Prénom" value="Jayden"><input id="last" placeholder="Nom" value="Carter"><label>Taille : <b id="heightVal">1,80 m</b></label><input id="height" type="range" min="170" max="200" value="180"><label>Poids : <b id="weightVal">85 kg</b></label><input id="weight" type="range" min="60" max="150" value="85"><select id="origin"><option>Quartier</option><option>Banlieue</option><option>Famille sportive</option><option>Petite ville</option><option>Académie sportive</option><option>Famille aisée</option></select><select id="city"><option>New York</option><option>Los Angeles</option><option>Miami</option><option>Dallas</option><option>Atlanta</option><option>Chicago</option><option>Houston</option><option>Seattle</option><option>Detroit</option><option>Philadelphia</option></select><select id="school"><option>Lincoln High School</option><option>Central High School</option><option>Westside High School</option><option>Eastview High School</option><option>Northside High School</option></select><select id="pos"><option>Quarterback</option><option>Running Back</option><option>Wide Receiver</option><option>Cornerback</option><option>Linebacker</option><option>Defensive End</option><option>Offensive Lineman</option><option>Kicker</option></select><button id="startBtn" class="btn">Valider mon joueur</button><p id="startError" class="bad hide"></p></section><section id="career" class="hide"><div class="card profileHead" id="profileHead"><h2 id="name"></h2><p id="mini"></p><small>Appuie sur ton nom pour afficher tes statistiques</small><div id="profileStats" class="hide"><p id="profile"></p><p id="coachNote"></p><div class="stats"><div class="stat"><b id="fans">1200</b><small>Fans</small></div><div class="stat"><b id="rep">50</b><small>Réputation</small></div><div class="stat"><b id="conf">70</b><small>Confiance</small></div><div class="stat"><b id="coach">60</b><small>Coach</small></div><div class="stat"><b id="college">0</b><small>Offres</small></div></div></div></div><div id="hub" class="card"><h2>Carrière · Vie privée</h2><p id="date"></p><p id="msg"></p><div class="grid"><button id="trainingBtn" class="choice">🏋️ Entraînement</button><button id="datingBtn" class="choice hide">❤️ Rencard</button><button id="partyBtn" class="choice">🎉 Soirée</button><button id="liveBtn" class="choice">📱 Livestream</button><button id="vacationBtn" class="choice">✈️ Vacances</button><button id="matchBtn" class="choice">🏈 Jouer un match</button><button id="offersBtn" class="choice">🎓 Offres universitaires</button><button id="draftBtn" class="choice hide">🏆 Draft NFL</button></div><button id="monthBtn" class="btn">📅 +1 MOIS</button></div><div id="activity" class="card hide"></div><div id="event" class="card hide"><h2 id="eventTitle"></h2><p id="eventDesc"></p><div id="eventChoices"></div></div><div id="game" class="card hide"><h2 id="gameTitle"></h2><p id="gameDesc"></p><div id="gameChoices"></div></div><div id="interview" class="card hide"><h2>🎙️ Interview</h2><p>Que réponds-tu ?</p><button class="choice interview" data-v="5">Rester humble</button><button class="choice interview" data-v="10">Assumer mes ambitions</button><button class="choice interview" data-v="3">Rendre hommage à l'équipe</button></div><div id="after" class="card hide"><h2>Match terminé</h2><p id="result"></p><button id="continueBtn" class="btn">▶ Continuer</button><button id="afterMonthBtn" class="btn">📅 +1 MOIS</button></div><div id="offers" class="card hide"><h2>🎓 Offres universitaires</h2><div id="offerList"></div><button class="btn back">Retour</button></div><div id="draft" class="card hide"><h2>🏆 Draft NFL</h2><p id="draftText"></p><div id="draftChoices"></div><button class="btn back">Retour</button></div></section></main><script>(function(){'use strict';var P=null,age=16,month=1,activities=0,fatigue=0,matchNo=1,step=0,score=0,hasGF=false,offers=[];var S={fans:1200,rep:50,conf:70,coach:60,college:0};var $=function(id){return document.getElementById(id)};function safeSave(){try{if(P)localStorage.setItem('rtnfl',JSON.stringify(P))}catch(e){}}function show(id){$(id).classList.remove('hide')}function hide(id){$(id).classList.add('hide')}function hidePanels(){['activity','event','game','interview','after','offers','draft'].forEach(hide)}function update(){ $('fans').textContent=Math.max(0,S.fans).toLocaleString('fr-FR');$('rep').textContent=Math.round(S.rep);$('conf').textContent=Math.round(S.conf);$('coach').textContent=Math.round(S.coach);$('college').textContent=S.college;$('date').textContent='Âge '+age+' · Mois '+month+' · Match '+matchNo;$('msg').textContent=(3-activities)+' activité(s) restante(s) · Fatigue '+fatigue+'/100';$('datingBtn').classList.toggle('hide',!hasGF);$('draftBtn').classList.toggle('hide',age<21)}function hub(){hidePanels();show('hub');update()}function result(good,text){var d=document.createElement('div');d.className=good?'good':'bad';d.textContent=(good?'✓ Bon choix : ':'✕ Mauvais choix : ')+text;$('hub').prepend(d);setTimeout(function(){if(d.parentNode)d.remove()},5000);update()}function start(){try{P={first:$('first').value.trim()||'Jayden',last:$('last').value.trim()||'Carter',height:Number($('height').value),weight:Number($('weight').value),origin:$('origin').value,city:$('city').value,school:$('school').value,pos:$('pos').value};safeSave();$('creator').classList.add('hide');$('career').classList.remove('hide');$('name').textContent=P.first+' '+P.last;$('mini').textContent=(P.height/100).toFixed(2).replace('.',',')+' m · '+P.weight+' kg';$('profile').textContent=P.city+' · '+P.school+' · '+P.pos+' · Origine : '+P.origin;physical();hub()}catch(e){$('startError').textContent='Erreur de lancement : '+e.message;$('startError').classList.remove('hide')}}function physical(){var ideals={Quarterback:[185,115],RunningBack:[178,105],WideReceiver:[183,100],Cornerback:[180,92],Linebacker:[188,115],DefensiveEnd:[193,125],OffensiveLineman:[193,135],Kicker:[180,95]};var ideal=ideals[P.pos]||[183,100],dh=Math.abs(P.height-ideal[0]),dw=Math.abs(P.weight-ideal[1]),note='';if(dh<=5){S.conf+=4;note='Le coach trouve ton gabarit très adapté à ton poste.'}else if(dh>10){S.conf-=5;note='Le coach trouve ta taille atypique pour ton poste. Tu devras compenser avec ta technique.'}else note='Le coach pense que ton gabarit est acceptable pour ton poste.';if(dw>25){S.conf-=5;note+=' Ton poids est également éloigné du profil recherché.'}if(P.pos==='WideReceiver'&&P.height>=190){S.fans+=150;note+=' Ton grand gabarit peut être un avantage dans les duels aériens.'}$('coachNote').textContent=note}function needActivity(){if(activities>=3){$('msg').textContent='Tu as utilisé tes 3 activités. Passe au mois suivant.';return false}activities++;return true}function openTraining(){if(!needActivity())return;hidePanels();show('activity');$('activity').innerHTML='<h2>🏋️ Entraînement</h2><p>Choisis ta séance.</p><button class="choice train" data-f="10" data-c="8">💪 Musculation</button><button class="choice train" data-f="6" data-c="4">🫀 Cardio</button><button class="choice train" data-f="5" data-c="5">🏃 Tapis de course</button><button class="choice train" data-f="7" data-c="8">🏈 Exercices de lancer</button><button class="choice train" data-f="5" data-c="6">⚡ Agilité</button><button class="btn cancel">Annuler</button>';document.querySelectorAll('.train').forEach(function(b){b.onclick=function(){fatigue=Math.min(100,fatigue+Number(b.dataset.f));S.conf+=Number(b.dataset.c);S.rep+=3;S.coach+=4;hub();result(true,'Ta séance améliore ta progression. La fatigue monte à '+fatigue+'/100.')}});$('activity').querySelector('.cancel').onclick=function(){activities--;hub()}}function openLive(){if(!needActivity())return;hidePanels();show('activity');$('activity').innerHTML='<h2>📱 Livestream</h2><p>Quel live veux-tu faire ?</p><button class="choice live" data-r="5" data-f="400">🎮 Gaming</button><button class="choice live" data-r="4" data-f="300">💬 Discussion</button><button class="choice live" data-r="5" data-f="350">🏈 Analyse football</button><button class="choice live" data-r="7" data-f="700">🔥 Défi sportif</button><button class="choice live" data-r="9" data-f="1200">⭐ Apparition dans le live d’un streamer connu</button><button class="btn cancel">Annuler</button>';document.querySelectorAll('.live').forEach(function(b){b.onclick=function(){S.rep+=Number(b.dataset.r);S.fans+=Number(b.dataset.f);hub();result(true,b.textContent+' : ton contenu attire de nouveaux spectateurs.')}});$('activity').querySelector('.cancel').onclick=function(){activities--;hub()}}function dating(){if(!hasGF)return;if(!needActivity())return;S.conf+=6;S.fans+=50;hub();result(true,'Le rendez-vous s’est bien passé. Votre relation se renforce.')}function simple(name,rep,fans,conf,coach){if(!needActivity())return;S.rep+=rep;S.fans+=fans;S.conf+=conf;S.coach+=coach;hub();result(true,name+' : ta décision a un effet positif sur ta carrière.')}var games=[['Premier drive','La défense joue très haut.',['Passe profonde','Passe courte','Course']],['Provocation','Un défenseur te provoque devant les caméras.',['Ignorer','Répondre','Le défier']],['Drive décisif','20 secondes. Ton équipe est menée.',['Passe longue','Jeu sécurisé','Prendre le risque']]];function match(){hidePanels();show('game');step=0;score=0;renderGame()}function renderGame(){var g=games[step];$('gameTitle').textContent='🏈 '+g[0]+' · '+(step+1)+'/3';$('gameDesc').textContent=g[1];$('gameChoices').innerHTML='';g[2].forEach(function(t,i){var b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=function(){var penalty=fatigue>=75?3:0;score+=Math.max(1,(i===0?7:i===1?4:6)-penalty);S.fans+=300;step++;if(step<3)renderGame();else finishMatch()};$('gameChoices').appendChild(b)})}function finishMatch(){var win=score>=15;S.coach+=win?5:-3;if(win)S.rep+=8;$('gameTitle').textContent=win?'🏆 Victoire':'😬 Défaite';$('gameDesc').textContent='Performance : '+score+' points.'+(fatigue>=75?' Ta fatigue élevée a pénalisé ta performance.':'');$('gameChoices').innerHTML='';show('interview')}function interview(v){S.rep+=v;S.fans+=v*100;hide('interview');show('after');$('result').textContent='Interview terminée. Tu peux continuer ta carrière ou passer au mois suivant.';matchNo++;update()}function nextMonth(){month++;activities=0;fatigue=Math.max(0,fatigue-15);if(month>12){month=1;age++;if(age>=18)generateOffers()}hub();randomEvent()}var events=[['📸 Vidéo virale','Une action de ton match devient virale.',['Profiter de la visibilité','Rester discret']],['🎬 Sponsor','Une marque locale veut te rencontrer.',['Accepter','Refuser']],['🏫 Recruteur','Un recruteur universitaire regarde ton match.',['Répondre','Attendre']],['🩹 Petite blessure','Une douleur apparaît après l’entraînement.',['Te reposer','Continuer']],['🎤 Interview surprise','Un journaliste veut ton avis sur la NFL.',['Rester humble','Parler de tes ambitions']],['🎧 Artiste','Un rappeur connu partage une vidéo de toi.',['Le remercier','Rester concentré']],['📱 Rumeur','Une rumeur circule sur les réseaux.',['Ignorer','Répondre']],['🏆 Tournoi','Un tournoi attire des recruteurs.',['Tout donner','Préserver ton énergie']]];function randomEvent(){hidePanels();show('event');var e=events[Math.floor(Math.random()*events.length)];$('eventTitle').textContent=e[0];$('eventDesc').textContent=e[1];$('eventChoices').innerHTML='';e[2].forEach(function(t,i){var b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=function(){var good=i===0;S.rep+=good?7:2;S.fans+=good?500:100;S.conf+=good?5:1;var box=document.createElement('div');box.className=good?'good':'bad';box.textContent=(good?'✓ Bon choix : ':'✕ Mauvais choix : ')+(good?'ta décision améliore ta réputation, ta confiance et ta visibilité.':'cette décision te coûte en réputation ou en confiance. Tu devras te rattraper.');$('eventChoices').innerHTML='';$('eventChoices').appendChild(box);var c=document.createElement('button');c.className='btn';c.textContent='▶ Continuer';c.onclick=hub;$('eventChoices').appendChild(c);update()};$('eventChoices').appendChild(b)})}function generateOffers(){while(S.college<Math.min(4,Math.floor(S.rep/20))){S.college++;offers.push(['State University','Pacific College','Metro University','Lakeside University','Southern Tech'][S.college-1])}}function showOffers(){hidePanels();show('offers');$('offerList').innerHTML=offers.length?offers.map(function(o){return '<p>🎓 '+o+' · Offre de bourse</p>'}).join(''):'<p>Pas encore d’offre. Continue à progresser.</p>'}function draft(){hidePanels();show('draft');if(age<21){$('draftText').textContent='La Draft NFL n’est pas encore accessible. Tu dois avoir l’âge requis.';return}var ready=S.rep>=140&&S.coach>=90;$('draftText').textContent=ready?'Les scouts NFL te suivent. Tu peux entrer dans la Draft !':'Tu es assez âgé, mais tu dois encore améliorer ta réputation et la confiance du coach.';$('draftChoices').innerHTML='';if(ready){var b=document.createElement('button');b.className='btn';b.textContent='🏈 Entrer dans la Draft';b.onclick=function(){S.fans+=5000;$('draftText').textContent='🎉 '+P.first+' '+P.last+' est drafté !';update()};$('draftChoices').appendChild(b)}}$('height').oninput=function(){$('heightVal').textContent=(Number(this.value)/100).toFixed(2).replace('.',',')+' m'};$('weight').oninput=function(){$('weightVal').textContent=this.value+' kg'};$('startBtn').onclick=start;$('profileHead').onclick=function(){$('profileStats').classList.toggle('hide')};$('trainingBtn').onclick=openTraining;$('liveBtn').onclick=openLive;$('datingBtn').onclick=dating;$('partyBtn').onclick=function(){simple('La soirée',6,300,2,-2)};$('vacationBtn').onclick=function(){simple('Les vacances',2,200,8,1)};$('matchBtn').onclick=match;$('offersBtn').onclick=showOffers;$('draftBtn').onclick=draft;$('monthBtn').onclick=nextMonth;$('continueBtn').onclick=hub;$('afterMonthBtn').onclick=nextMonth;document.querySelectorAll('.interview').forEach(function(b){b.onclick=function(){interview(Number(b.dataset.v))}});document.querySelectorAll('.back').forEach(function(b){b.onclick=hub});try{var old=JSON.parse(localStorage.getItem('rtnfl'));if(old){P=old;$('creator').classList.add('hide');$('career').classList.remove('hide');$('name').textContent=P.first+' '+P.last;$('mini').textContent=(P.height/100).toFixed(2).replace('.',',')+' m · '+P.weight+' kg';$('profile').textContent=P.city+' · '+P.school+' · '+P.pos+' · Origine : '+P.origin;physical();hub()}}catch(e){}})();</script></body></html>
