<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to NFL</title><style>body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:20px}.card{background:#121823;border:1px solid #293342;border-radius:16px;padding:20px;margin:15px 0}.hide{display:none!important}.btn,.choice{display:block;width:100%;box-sizing:border-box;padding:14px;margin:9px 0;border:0;border-radius:9px;background:#ff5b22;color:white;font-weight:bold;cursor:pointer}.choice{text-align:left;background:#202936}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:#090c11;padding:10px;border-radius:9px}.stat b{display:block;font-size:18px}@media(max-width:650px){.stats,.grid{grid-template-columns:1fr 1fr}}h1{font-size:38px}small{color:#aeb8c7}.ok{border-color:#22c55e}.warn{border-color:#eab308}</style></head><body><main class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><section id="creator" class="card"><h2>Créer ton joueur</h2><input id="first" placeholder="Prénom" value="Jayden" style="width:100%;padding:13px;box-sizing:border-box"><br><br><input id="last" placeholder="Nom" value="Carter" style="width:100%;padding:13px;box-sizing:border-box"><label>Taille : <b id="heightVal">1m80</b></label><input id="height" type="range" min="170" max="200" value="180" oninput="heightVal.textContent=(this.value/100).toFixed(2).replace('.',',')+' m'" style="width:100%"><label>Poids : <b id="weightVal">85 kg</b></label><input id="weight" type="range" min="60" max="150" value="85" oninput="weightVal.textContent=this.value+' kg'" style="width:100%"><select id="origin" style="width:100%;padding:13px;margin-top:12px"><option>Quartier</option><option>Banlieue</option><option>Famille sportive</option><option>Petite ville</option><option>Académie sportive</option><option>Famille aisée</option></select><select id="city" style="width:100%;padding:13px;margin-top:12px"><option>New York</option><option>Los Angeles</option><option>Miami</option><option>Dallas</option><option>Atlanta</option><option>Chicago</option><option>Houston</option><option>Seattle</option><option>Detroit</option><option>Philadelphia</option></select><select id="school" style="width:100%;padding:13px;margin-top:12px"><option>Lincoln High School</option><option>Central High School</option><option>Westside High School</option><option>Eastview High School</option><option>Northside High School</option></select><select id="pos" style="width:100%;padding:13px;margin-top:12px"><option>Quarterback</option><option>Running Back</option><option>Wide Receiver</option><option>Cornerback</option><option>Linebacker</option><option>Defensive End</option><option>Offensive Lineman</option><option>Kicker</option></select><button class="btn" onclick="start()">Valider mon joueur</button></section><section id="career" class="hide"><div class="card"><h2 id="name"></h2><p id="profile"></p><p id="coachNote"></p><div class="stats"><div class="stat"><b id="fans">1200</b><small>Fans</small></div><div class="stat"><b id="rep">50</b><small>Réputation</small></div><div class="stat"><b id="conf">70</b><small>Confiance</small></div><div class="stat"><b id="coach">60</b><small>Coach</small></div><div class="stat"><b id="college">0</b><small>Offres universitaires</small></div></div></div><div id="hub" class="card"><h2>Vie privée · Vie scolaire</h2><p id="date"></p><p id="msg">3 activités disponibles.</p><div class="grid"><button class="choice" onclick="act('Entraînement',5,0,7,5)">🏋️ Entraînement</button><button class="choice" onclick="act('Rendez-vous',4,100,5,0)">❤️ Rendez-vous</button><button class="choice" onclick="act('Soirée',6,300,2,-2)">🎉 Soirée</button><button class="choice" onclick="act('Livestream',3,800,3,0)">📱 Livestream</button><button class="choice" onclick="act('Vacances',2,200,8,1)">✈️ Vacances</button><button class="choice" onclick="match()">🏈 Jouer un match</button><button class="choice" onclick="showOffers()">🎓 Voir les offres universitaires</button><button class="choice" onclick="draftCheck()">🏆 Progresser vers la Draft</button></div><button class="btn" onclick="nextMonth()">📅 +1 MOIS</button></div><div id="event" class="card hide"><h2>🎲 Événement aléatoire</h2><h3 id="et"></h3><p id="ed"></p><div id="ec"></div></div><div id="game" class="card hide"><h2 id="gt"></h2><p id="gd"></p><div id="gc"></div></div><div id="interview" class="card hide"><h2>🎙️ Interview</h2><p>Que réponds-tu ?</p><button class="choice" onclick="interview(5)">Rester humble</button><button class="choice" onclick="interview(10)">Assumer mes ambitions</button><button class="choice" onclick="interview(3)">Rendre hommage à l'équipe</button></div><div id="after" class="card hide"><h2>Match terminé</h2><p id="result"></p><button class="btn" onclick="continueCareer()">▶ Continuer</button><button class="btn" onclick="nextMonth()">📅 +1 MOIS</button></div><div id="offers" class="card hide"><h2>🎓 Offres universitaires</h2><div id="offerList"></div><button class="btn" onclick="hub()">Retour</button></div><div id="draft" class="card hide"><h2>🏆 Draft NFL</h2><p id="draftText"></p><div id="draftChoices"></div><button class="btn" onclick="hub()">Retour</button></div><div id="over" class="card hide"><h2>🚨 Fin de carrière</h2><p id="overText"></p><button class="btn" onclick="location.reload()">Recommencer</button></div></section></main><script>var P=null,month=1,age=16,activities=0,matchNo=1,step=0,score=0,offers=[],S={fans:1200,rep:50,conf:70,coach:60,college:0};var games=[['Premier drive','La défense joue très haut.',['Passe profonde','Passe courte','Course']],['Provocation','Un défenseur te provoque devant les caméras.',['Ignorer','Répondre','Le défier']],['Drive décisif','20 secondes. Ton équipe est menée.',['Passe longue','Jeu sécurisé','Tenter l impossible']]];var randoms=[['📸 Vidéo virale','Une action devient virale.',['Profiter de la visibilité','Rester discret']],['🎬 Sponsor','Une marque locale veut te rencontrer.',['Accepter','Refuser']],['🏫 Recruteur','Un coach universitaire te contacte.',['Répondre','Attendre']],['🩹 Blessure','Une douleur apparaît après l entraînement.',['Te reposer','Jouer quand même']],['🎤 Interview','Un journaliste veut ton avis sur la NFL.',['Rester humble','Annoncer tes ambitions']],['🎧 Artiste','Un rappeur connu partage une vidéo de toi.',['Le remercier','Rester concentré']],['🧑‍🤝‍🧑 Ancien ami','Une personne de ton passé revient.',['Garder tes distances','Reprendre contact']],['🌟 Média','Un média sportif veut raconter ton histoire.',['Accepter','Refuser']],['📱 Rumeur','Une rumeur circule sur les réseaux.',['Ignorer','Répondre']],['🏆 Tournoi','Un tournoi régional attire des recruteurs.',['Tout donner','Préserver ton énergie']]];var colleges=['State University','Pacific College','Metro University','Lakeside University','Southern Tech','Northern State'];function $(id){return document.getElementById(id)}function start(){P={first:$('first').value.trim()||'Jayden',last:$('last').value.trim()||'Carter',height:+$('height').value,weight:+$('weight').value,origin:$('origin').value,city:$('city').value,school:$('school').value,pos:$('pos').value};localStorage.setItem('rtnfl',JSON.stringify(P));$('creator').classList.add('hide');$('career').classList.remove('hide');$('name').textContent=P.first+' '+P.last+' · '+P.pos;physicalImpact();update();hub()}function physicalImpact(){var h=P.height,w=P.weight,p=P.pos;var note='';var ideal={Quarterback:[185,115],Running Back:[178,105],['Wide Receiver']:[183,100],Cornerback:[180,92],Linebacker:[188,115],['Defensive End']:[193,125],['Offensive Lineman']:[193,135],Kicker:[180,95]}[p]||[183,100];var dh=Math.abs(h-ideal[0]),dw=Math.abs(w-ideal[1]);if(dh>10){S.conf-=Math.min(10,Math.floor(dh/3));note='⚠️ Coach : ta taille est atypique pour '+p+'. Tu devras compenser avec ta technique.'}else if(dh<=5){S.conf+=4;note='✅ Coach : ton gabarit est très adapté au poste de '+p+'.'}if(dw>25){S.conf-=5;note+=' Ton poids est aussi éloigné du profil recherché.'}if(p==='Wide Receiver'&&h>=190){S.fans+=150;note+=' Ton grand gabarit peut devenir un avantage dans les duels aériens.'}if(p==='Quarterback'&&h<180){S.coach-=5;note+=' Le coach craint ta vision depuis la poche.'}$('coachNote').textContent=note;$('profile').textContent=P.city+' · '+P.school+' · '+(P.height/100).toFixed(2)+' m · '+P.weight+' kg · Origine : '+P.origin}function hub(){$('hub').classList.remove('hide');['event','game','interview','after','offers','draft'].forEach(x=>$(x).classList.add('hide'));$('date').textContent='Âge '+age+' · Mois '+month+' · Match '+matchNo;$('msg').textContent='Tu as '+(3-activities)+' activité(s) disponible(s) ce mois-ci.'}function act(n,r,f,c,k){if(activities>=3){$('msg').textContent='Tu as utilisé tes 3 activités. Passe au mois suivant.';return}activities++;S.rep+=r;S.fans+=f;S.conf+=c;S.coach+=k;$('msg').textContent=n+' terminé. '+(3-activities)+' activité(s) restante(s).';update();if(S.rep>=80&&S.college<3){S.college++;offers.push(colleges[(S.college-1)%colleges.length])}}function nextMonth(){if(!P)return;month++;activities=0;if(month>12){month=1;age++;if(age===18)generateOffers()}update();randomEvent()}function generateOffers(){while(S.college<Math.min(4,Math.floor(S.rep/20))){S.college++;offers.push(colleges[(S.college-1)%colleges.length])}}function randomEvent(){ $('hub').classList.add('hide');$('event').classList.remove('hide');var list=randoms.slice();if(P.origin==='Quartier')list.push(['🚨 Ton passé te rattrape','Une ancienne connaissance te propose de renouer avec un milieu criminel. Une mauvaise décision peut mettre fin à ta carrière.',['Couper les liens','Accepter']]);var e=list[Math.floor(Math.random()*list.length)];$('et').textContent=e[0];$('ed').textContent=e[1];var box=$('ec');box.innerHTML='';e[2].forEach(function(t,i){var b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=function(){if(e[0].indexOf('Ton passé')>=0&&i===1){end('Une affaire criminelle a entraîné ton arrestation. Ta carrière sportive est terminée.');return}S.rep+=i?3:7;S.fans+=i?100:500;S.conf+=i?2:5;S.coach+=i?0:3;update();box.innerHTML='<p>Conséquence enregistrée.</p><button class="btn" onclick="hub()">▶ Continuer</button>'};box.appendChild(b)})}function match(){ $('hub').classList.add('hide');$('game').classList.remove('hide');step=0;score=0;renderGame()}function renderGame(){var g=games[step];$('gt').textContent='🏈 Événement '+(step+1)+' / 3 : '+g[0];$('gd').textContent=g[1];var box=$('gc');box.innerHTML='';g[2].forEach(function(t,i){var b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=function(){score+=i===0?7:i===1?4:6;S.rep+=i===0?3:2;S.fans+=300;step++;if(step<3)renderGame();else finishMatch()};box.appendChild(b)})}function finishMatch(){var win=score>=15;S.coach+=win?5:-2;if(win)S.rep+=8;$('gt').textContent=win?'🏆 VICTOIRE':'😬 DÉFAITE';$('gd').textContent='Performance : '+score+' points.';$('gc').innerHTML='';$('interview').classList.remove('hide');$('interview').scrollIntoView({behavior:'smooth'})}function interview(n){S.rep+=n;S.fans+=n*100;update();$('interview').classList.add('hide');$('after').classList.remove('hide');$('result').textContent='Interview terminée. Ta réputation évolue. Tu peux continuer ou passer au mois suivant.';matchNo++}function continueCareer(){hub()}function showOffers(){$('hub').classList.add('hide');$('offers').classList.remove('hide');var box=$('offerList');box.innerHTML=offers.length?offers.map((x,i)=>'<button class="choice" onclick="acceptOffer('+i+')">🎓 '+x+' · Offre de bourse</button>').join(''):'<p>Pas encore d offres. Améliore tes performances et ta réputation.</p>'}function acceptOffer(i){var c=offers[i];S.coach+=8;S.rep+=5;offers.splice(i,1);$('offerList').innerHTML='<h3>✅ Offre acceptée : '+c+'</h3><p>Tu es désormais suivi par ce programme universitaire.</p><button class="btn" onclick="hub()">Continuer</button>';update()}function draftCheck(){$('hub').classList.add('hide');$('draft').classList.remove('hide');var ready=age>=21&&S.rep>=140&&S.coach>=90;var text=age<21?'Tu dois encore progresser avant la Draft.':ready?'Les scouts NFL te suivent. Tu es éligible pour la Draft !':'Tu es éligible, mais tes performances ne suffisent pas encore pour être un choix sûr.';$('draftText').textContent=text;var box=$('draftChoices');box.innerHTML='';if(age>=21){var b=document.createElement('button');b.className='btn';b.textContent=ready?'🏈 Entrer dans la Draft':'📈 Continuer à progresser';b.onclick=function(){if(ready){var pick=Math.max(1,Math.min(7,Math.floor(S.rep/25)));$('draftText').textContent='🎉 '+P.first+' '+P.last+' est drafté au '+pick+'e tour ! Une équipe NFL mise sur lui.';S.fans+=5000;S.rep+=30;update()}else hub()};box.appendChild(b)}}function end(t){['event','hub','game','interview','after','offers','draft'].forEach(x=>$(x).classList.add('hide'));$('over').classList.remove('hide');$('overText').textContent=t;localStorage.removeItem('rtnfl')}function update(){$('fans').textContent=S.fans.toLocaleString('fr-FR');$('rep').textContent=S.rep;$('conf').textContent=S.conf;$('coach').textContent=S.coach;$('college').textContent=S.college;$('date').textContent='Âge '+age+' · Mois '+month+' · Match '+matchNo}try{var old=JSON.parse(localStorage.getItem('rtnfl'));if(old){P=old;$('creator').classList.add('hide');$('career').classList.remove('hide');$('name').textContent=P.first+' '+P.last+' · '+P.pos;physicalImpact();hub()}}catch(e){}</script></body></html>
