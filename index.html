<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to NFL</title><style>body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#121823;border:1px solid #293342;border-radius:16px;padding:18px;margin:14px 0}.hidden{display:none}.btn,.choice{width:100%;padding:14px;margin:7px 0;border:0;border-radius:9px;background:#ff5b22;color:white;font-weight:bold;font-size:16px}.choice{background:#202936;text-align:left}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#090c11;padding:10px;border-radius:8px}.good{padding:14px;border-radius:9px;background:#123b24;color:#a5ffc3}.bad{padding:14px;border-radius:9px;background:#40171b;color:#ff9aa5}@media(max-width:600px){.grid,.stats{grid-template-columns:1fr 1fr}input,select{font-size:16px}}</style></head><body><main class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><section id="creator" class="card"><h2>Créer ton joueur</h2><input id="first" placeholder="Prénom" value="Jayden"><br><br><input id="last" placeholder="Nom" value="Carter"><p>Taille : <b id="hv">1,80 m</b></p><input id="height" type="range" min="170" max="200" value="180"><p>Poids : <b id="wv">85 kg</b></p><input id="weight" type="range" min="60" max="150" value="85"><select id="pos"><option>Quarterback</option><option>Running Back</option><option>Wide Receiver</option><option>Cornerback</option><option>Linebacker</option><option>Defensive End</option><option>Offensive Lineman</option><option>Kicker</option></select><select id="city"><option>New York</option><option>Los Angeles</option><option>Miami</option><option>Dallas</option><option>Atlanta</option><option>Chicago</option><option>Houston</option></select><select id="school"><option>Lincoln High School</option><option>Central High School</option><option>Westside High School</option><option>Eastview High School</option></select><button id="start" class="btn" type="button">Valider mon joueur</button><div id="err" class="bad hidden"></div></section><section id="career" class="hidden"><div class="card"><h2 id="player"></h2><p id="mini"></p><button id="statsBtn" class="choice">📊 Voir mes statistiques</button><div id="stats" class="hidden"><p id="profile"></p><p id="coachNote"></p><div class="stats"><div class="stat">Fans<br><b id="fans">1200</b></div><div class="stat">Réputation<br><b id="rep">50</b></div><div class="stat">Confiance<br><b id="conf">70</b></div><div class="stat">Coach<br><b id="coach">60</b></div></div></div></div><div id="hub" class="card"><h2>Carrière</h2><p id="date"></p><p id="status"></p><div class="grid"><button id="train" class="choice">🏋️ Entraînement</button><button id="live" class="choice">📱 Livestream</button><button id="party" class="choice">🎉 Soirée</button><button id="vacation" class="choice">✈️ Vacances</button><button id="match" class="choice">🏈 Match</button><button id="offers" class="choice">🎓 Universités</button><button id="dating" class="choice hidden">❤️ Rencard</button><button id="draft" class="choice hidden">🏆 Draft NFL</button></div><button id="next" class="btn">📅 +1 MOIS</button></div><div id="panel" class="card hidden"></div></section></main><script>"use strict";var state={age:16,month:1,activities:0,fatigue:0,fans:1200,rep:50,conf:70,coach:60,gf:false,player:null};function E(id){return document.getElementById(id)}function show(id){E(id).classList.remove('hidden')}function hide(id){E(id).classList.add('hidden')}function hub(){hide('panel');show('hub');E('date').textContent='Âge '+state.age+' · Mois '+state.month;E('status').textContent=(3-state.activities)+' activité(s) restante(s) · Fatigue '+state.fatigue+'/100';E('dating').classList.toggle('hidden',!state.gf);E('draft').classList.toggle('hidden',state.age<21);update()}function update(){E('fans').textContent=state.fans;E('rep').textContent=state.rep;E('conf').textContent=state.conf;E('coach').textContent=state.coach}function use(){if(state.activities>=3){E('status').textContent='Tu as déjà utilisé tes 3 activités ce mois-ci.';return false}state.activities++;return true}function message(ok,text){E('panel').innerHTML='<div class="'+(ok?'good':'bad')+'">'+(ok?'✓ Bon choix : ':'✕ Mauvais choix : ')+text+'</div><button id="back" class="btn">Continuer</button>';show('panel');E('back').onclick=hub}function startGame(){try{state.player={first:E('first').value.trim()||'Jayden',last:E('last').value.trim()||'Carter',height:Number(E('height').value),weight:Number(E('weight').value),pos:E('pos').value,city:E('city').value,school:E('school').value};E('player').textContent=state.player.first+' '+state.player.last;E('mini').textContent=(state.player.height/100).toFixed(2).replace('.',',')+' m · '+state.player.weight+' kg';E('profile').textContent=state.player.city+' · '+state.player.school+' · '+state.player.pos;var ideal=state.player.pos==='Quarterback'?185:183;state.coach+=Math.abs(state.player.height-ideal)<=5?5:-3;E('coachNote').textContent=Math.abs(state.player.height-ideal)<=5?'Le coach trouve ton gabarit adapté à ton poste.':'Le coach pense que ton gabarit est atypique pour ce poste.';hide('creator');show('career');hub()}catch(e){E('err').textContent='Le jeu a rencontré une erreur : '+e.message;show('err')}}E('height').oninput=function(){E('hv').textContent=(Number(this.value)/100).toFixed(2).replace('.',',')+' m'};E('weight').oninput=function(){E('wv').textContent=this.value+' kg'};E('start').onclick=startGame;E('statsBtn').onclick=function(){E('stats').classList.toggle('hidden')};E('train').onclick=function(){if(!use())return;hide('hub');show('panel');E('panel').innerHTML='<h2>🏋️ Entraînement</h2><button class="choice t">💪 Musculation</button><button class="choice t">🫀 Cardio</button><button class="choice t">🏃 Tapis de course</button><button class="choice t">🏈 Exercices de lancer</button><button class="choice t">⚡ Agilité</button>';document.querySelectorAll('.t').forEach(function(b){b.onclick=function(){state.fatigue=Math.min(100,state.fatigue+(b.textContent.includes('Musculation')?10:6));state.conf+=5;state.rep+=3;hub();message(true,b.textContent+' : tu progresses. Ta fatigue est maintenant de '+state.fatigue+'/100.')}})};E('live').onclick=function(){if(!use())return;hide('hub');show('panel');E('panel').innerHTML='<h2>📱 Livestream</h2><button class="choice l">🎮 Gaming</button><button class="choice l">💬 Discussion</button><button class="choice l">🏈 Analyse football</button><button class="choice l">🔥 Défi sportif</button><button class="choice l">⭐ Live avec un streamer connu</button>';document.querySelectorAll('.l').forEach(function(b){b.onclick=function(){state.rep+=6;state.fans+=500;hub();message(true,b.textContent+' : ton live attire de nouveaux spectateurs.')}})};E('dating').onclick=function(){if(!state.gf)return;if(!use())return;state.conf+=6;hub();message(true,'Le rendez-vous s’est bien passé. Votre relation se renforce.')}E('party').onclick=function(){if(!use())return;state.fans+=300;state.rep+=5;hub();message(true,'La soirée te permet de rencontrer de nouvelles personnes et augmente ta visibilité.')}E('vacation').onclick=function(){if(!use())return;state.fatigue=Math.max(0,state.fatigue-20);state.conf+=6;hub();message(true,'Les vacances te permettent de récupérer. Ta fatigue diminue.')}E('match').onclick=function(){if(!use())return;hide('hub');show('panel');var penalty=state.fatigue>=75?4:0;E('panel').innerHTML='<h2>🏈 Match</h2><p>Ta fatigue est à '+state.fatigue+'/100.</p><button id="play" class="btn">Jouer les actions</button>';E('play').onclick=function(){var points=Math.max(1,18-penalty);state.fans+=600;state.rep+=points>=15?8:2;state.coach+=points>=15?5:-2;message(points>=15,'Tu termines le match avec '+points+' points de performance.'+(penalty?' La fatigue a réduit tes performances.':''))}};E('offers').onclick=function(){hide('hub');show('panel');E('panel').innerHTML='<h2>🎓 Universités</h2><p>'+(state.age<18?'Les recruteurs commencent seulement à te surveiller.':'Tes performances peuvent attirer des universités.')+'</p><button class="btn" id="back">Retour</button>';E('back').onclick=hub};E('next').onclick=function(){state.month++;state.activities=0;state.fatigue=Math.max(0,state.fatigue-15);if(state.month>12){state.month=1;state.age++}hub();show('panel');E('panel').innerHTML='<h2>🎲 Nouvelle situation</h2><p>Un événement de ta vie vient de se produire. Tu peux continuer ta carrière.</p><button class="btn" id="back">Continuer</button>';E('back').onclick=hub};E('draft').onclick=function(){hide('hub');show('panel');E('panel').innerHTML='<h2>🏆 Draft NFL</h2><p>Tu dois avoir au moins 21 ans pour entrer dans la Draft.</p><button class="btn" id="back">Retour</button>';E('back').onclick=hub};</script></body></html>
