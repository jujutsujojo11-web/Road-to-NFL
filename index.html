<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to NFL</title><style>body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#121823;border:1px solid #293342;border-radius:16px;padding:20px;margin:15px 0}.hide{display:none!important}.btn,.choice{display:block;width:100%;box-sizing:border-box;padding:14px;margin:9px 0;border:0;border-radius:9px;background:#ff5b22;color:white;font-weight:bold;cursor:pointer}.choice{text-align:left;background:#202936}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#090c11;padding:10px;border-radius:9px}.stat b{display:block;font-size:18px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}h1{font-size:38px}small{color:#aeb8c7}</style></head><body><main class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><section id="creator" class="card"><h2>Créer ton joueur</h2><input id="first" value="Jayden" style="width:100%;padding:13px;box-sizing:border-box"><br><br><input id="last" value="Carter" style="width:100%;padding:13px;box-sizing:border-box"><select id="origin" style="width:100%;padding:13px;margin-top:12px"><option>Quartier</option><option>Banlieue</option><option>Famille sportive</option><option>Petite ville</option><option>Académie sportive</option><option>Famille aisée</option></select><select id="pos" style="width:100%;padding:13px;margin-top:12px"><option>Quarterback</option><option>Running Back</option><option>Wide Receiver</option><option>Cornerback</option><option>Linebacker</option><option>Defensive End</option><option>Offensive Lineman</option><option>Kicker</option></select><button class="btn" onclick="start()">Valider mon joueur</button></section><section id="career" class="hide"><div class="card"><h2 id="name"></h2><p id="date"></p><div class="stats"><div class="stat"><b id="fans">1200</b><small>Fans</small></div><div class="stat"><b id="rep">50</b><small>Réputation</small></div><div class="stat"><b id="conf">70</b><small>Confiance</small></div><div class="stat"><b id="coach">60</b><small>Coach</small></div></div></div><div id="hub" class="card"><h2>Vie privée</h2><p id="msg">Tu as 3 activités ce mois-ci.</p><div class="grid"><button class="choice" onclick="act('Entraînement',5,0,7,5)">🏋️ Entraînement</button><button class="choice" onclick="act('Rendez-vous',4,100,5,0)">❤️ Rendez-vous</button><button class="choice" onclick="act('Soirée',6,300,2,-2)">🎉 Soirée</button><button class="choice" onclick="act('Livestream',3,800,3,0)">📱 Livestream</button><button class="choice" onclick="act('Vacances',2,200,8,1)">✈️ Vacances</button><button class="choice" onclick="match()">🏈 Jouer un match</button></div><button class="btn" onclick="nextMonth()">📅 +1 MOIS</button></div><div id="event" class="card hide"><h2>🎲 Événement aléatoire</h2><h3 id="et"></h3><p id="ed"></p><div id="ec"></div></div><div id="game" class="card hide"><h2 id="gt"></h2><p id="gd"></p><div id="gc"></div></div><div id="interview" class="card hide"><h2>🎙️ Interview</h2><p>Que réponds-tu ?</p><button class="choice" onclick="interview(5)">Rester humble</button><button class="choice" onclick="interview(10)">Assumer mes ambitions</button><button class="choice" onclick="interview(3)">Rendre hommage à l'équipe</button></div><div id="after" class="card hide"><h2>Match terminé</h2><p id="result"></p><button class="btn" onclick="continueCareer()">▶ Continuer</button><button class="btn" onclick="nextMonth()">📅 +1 MOIS</button></div><div id="over" class="card hide"><h2>🚨 Fin de carrière</h2><p id="overText"></p><button class="btn" onclick="location.reload()">Recommencer</button></div></section></main><script>var P=null,month=1,age=16,activities=0,matchNo=1,step=0,score=0,S={fans:1200,rep:50,conf:70,coach:60};var games=[['Premier drive','La défense joue très haut.',['Passe profonde','Passe courte','Course']],['Provocation','Un défenseur te provoque devant les caméras.',['Ignorer','Répondre','Le défier']],['Drive décisif','20 secondes. Ton équipe est menée.',['Passe longue','Jeu sécurisé','Tenter l impossible']]];var randoms=[['📸 Vidéo virale','Une action devient virale.',['Profiter de la visibilité','Rester discret']],['🎬 Sponsor','Une marque locale veut te rencontrer.',['Accepter','Refuser']],['🏫 Recruteur','Un coach universitaire te contacte.',['Répondre','Attendre']],['🩹 Blessure','Une douleur apparaît après l entraînement.',['Te reposer','Jouer quand même']],['🎤 Interview','Un journaliste veut ton avis sur la NFL.',['Rester humble','Annoncer tes ambitions']],['🎧 Artiste','Un rappeur connu partage une vidéo de toi.',['Le remercier','Rester concentré']],['🧑‍🤝‍🧑 Ancien ami','Une personne de ton passé revient.',['Garder tes distances','Reprendre contact']],['🌟 Média','Un média sportif veut raconter ton histoire.',['Accepter','Refuser']],['📱 Rumeur','Une rumeur circule sur les réseaux.',['Ignorer','Répondre']],['🏆 Tournoi','Un tournoi régional attire des recruteurs.',['Tout donner','Préserver ton énergie']]];function $(id){return document.getElementById(id)}function start(){P={first:$('first').value||'Jayden',last:$('last').value||'Carter',origin:$('origin').value,pos:$('pos').value};localStorage.setItem('rtnfl',JSON.stringify(P));$('creator').classList.add('hide');$('career').classList.remove('hide');$('name').textContent=P.first+' '+P.last+' · '+P.pos;update();hub()}function hub(){$('hub').classList.remove('hide');$('event').classList.add('hide');$('game').classList.add('hide');$('interview').classList.add('hide');$('after').classList.add('hide');$('date').textContent='Âge '+age+' · Mois '+month+' · Match '+matchNo;$('msg').textContent='Tu as '+(3-activities)+' activité(s) disponible(s) ce mois-ci.'}function act(n,r,f,c,k){if(activities>=3){$('msg').textContent='Tu as utilisé tes 3 activités. Passe au mois suivant.';return}activities++;S.rep+=r;S.fans+=f;S.conf+=c;S.coach+=k;$('msg').textContent=n+' terminé. '+(3-activities)+' activité(s) restante(s).';update()}function nextMonth(){if(!P)return;month++;activities=0;if(month>12){month=1;age++}update();randomEvent()}function randomEvent(){ $('hub').classList.add('hide');$('event').classList.remove('hide');var list=randoms.slice();if(P.origin==='Quartier')list.push(['🚨 Ton passé te rattrape','Une ancienne connaissance te propose de renouer avec un milieu criminel. Une mauvaise décision peut mettre fin à ta carrière.',['Couper les liens','Accepter']]);var e=list[Math.floor(Math.random()*list.length)];$('et').textContent=e[0];$('ed').textContent=e[1];var box=$('ec');box.innerHTML='';e[2].forEach(function(t,i){var b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=function(){if(e[0].indexOf('Ton passé')>=0&&i===1){end('Une affaire criminelle a entraîné ton arrestation. Ta carrière sportive est terminée.');return}S.rep+=i?3:7;S.fans+=i?100:500;S.conf+=i?2:5;S.coach+=i?0:3;update();box.innerHTML='<p>Conséquence enregistrée.</p><button class="btn" onclick="hub()">▶ Continuer</button>'};box.appendChild(b)})}function match(){ $('hub').classList.add('hide');$('game').classList.remove('hide');step=0;score=0;renderGame()}function renderGame(){var g=games[step];$('gt').textContent='🏈 Événement '+(step+1)+' / 3 : '+g[0];$('gd').textContent=g[1];var box=$('gc');box.innerHTML='';g[2].forEach(function(t,i){var b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=function(){score+=i===0?7:i===1?4:6;S.rep+=i===0?3:2;S.fans+=300;step++;if(step<3)renderGame();else finishMatch()};box.appendChild(b)})}function finishMatch(){var win=score>=15;S.coach+=win?5:-2;if(win)S.rep+=8;$('gt').textContent=win?'🏆 VICTOIRE':'😬 DÉFAITE';$('gd').textContent='Performance : '+score+' points.';$('gc').innerHTML='';$('interview').classList.remove('hide');$('interview').scrollIntoView({behavior:'smooth'})}function interview(n){S.rep+=n;S.fans+=n*100;update();$('interview').classList.add('hide');$('after').classList.remove('hide');$('result').textContent='Interview terminée. Ta réputation évolue. Tu peux continuer ou passer au mois suivant.';matchNo++}function continueCareer(){hub()}function end(t){$('event').classList.add('hide');$('hub').classList.add('hide');$('game').classList.add('hide');$('interview').classList.add('hide');$('after').classList.add('hide');$('over').classList.remove('hide');$('overText').textContent=t;localStorage.removeItem('rtnfl')}function update(){$('fans').textContent=S.fans.toLocaleString('fr-FR');$('rep').textContent=S.rep;$('conf').textContent=S.conf;$('coach').textContent=S.coach;$('date').textContent='Âge '+age+' · Mois '+month+' · Match '+matchNo}try{var old=JSON.parse(localStorage.getItem('rtnfl'));if(old){P=old;$('creator').classList.add('hide');$('career').classList.remove('hide');$('name').textContent=P.first+' '+P.last+' · '+P.pos;hub()}}catch(e){}</script></body></html>
