<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to NFL</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:#121823;border:1px solid #293342;border-radius:18px;padding:20px;margin:14px 0}.hidden{display:none!important}.btn,.choice{width:100%;padding:14px;margin:7px 0;border:0;border-radius:10px;background:#ff5b22;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.choice{background:#202936;text-align:left}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#090c11;padding:12px;border-radius:10px}.stat b{font-size:19px}.good,.bad{padding:16px;border-radius:11px;margin:10px 0}.good{background:#123b24;border:1px solid #28c76f;color:#b2ffc9}.bad{background:#40171b;border:1px solid #ff4d5f;color:#ffabb3}.muted{color:#aeb8c7}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#283242;color:#cbd4df;font-size:12px}.bar{height:10px;background:#252d39;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#ff5b22}.geargrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gear{background:#0a0e14;border:1px solid #2b3542;border-radius:12px;padding:12px}.gear img{width:100%;height:130px;object-fit:contain;background:#fff;border-radius:8px}.gear h3{margin:8px 0 4px}.gear small{color:#aeb8c7}@media(max-width:650px){.grid,.stats,.geargrid{grid-template-columns:1fr 1fr}}h1{font-size:38px}</style></head><body><main class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><section id="creator" class="card"><h2>Créer ton joueur</h2><input id="first" value="Jayden" placeholder="Prénom" style="width:100%;padding:13px"><br><br><input id="last" value="Carter" placeholder="Nom" style="width:100%;padding:13px"><p>Taille : <b id="hv">1,80 m</b></p><input id="height" type="range" min="170" max="200" value="180" style="width:100%"><p>Poids : <b id="wv">85 kg</b></p><input id="weight" type="range" min="60" max="150" value="85" style="width:100%"><select id="pos" style="width:100%;padding:13px"><option>Quarterback</option><option>Running Back</option><option>Wide Receiver</option><option>Cornerback</option><option>Linebacker</option><option>Defensive End</option><option>Offensive Lineman</option><option>Kicker</option></select><select id="city" style="width:100%;padding:13px;margin-top:10px"><option>New York</option><option>Los Angeles</option><option>Miami</option><option>Dallas</option><option>Atlanta</option><option>Chicago</option><option>Houston</option><option>Seattle</option></select><select id="school" style="width:100%;padding:13px;margin-top:10px"><option>Lincoln High School</option><option>Central High School</option><option>Westside High School</option><option>Eastview High School</option><option>Northside High School</option></select><button id="start" class="btn">Valider mon joueur</button></section><section id="career" class="hidden"><div class="card"><h2 id="player"></h2><p id="mini"></p><button id="statsBtn" class="choice">📊 Voir mes statistiques</button><div id="stats" class="hidden"><p id="profile"></p><p id="coachNote"></p><div class="stats"><div class="stat">Fans<br><b id="fans">1200</b></div><div class="stat">Réputation<br><b id="rep">50</b></div><div class="stat">Confiance<br><b id="conf">70</b></div><div class="stat">Coach<br><b id="coach">60</b></div></div><p>Fatigue</p><div class="bar"><i id="fatbar" style="width:0%"></i></div></div></div><div id="hub" class="card"><h2>Carrière · Vie privée</h2><p id="date"></p><p id="status"></p><div class="grid"><button id="train" class="choice">🏋️ Entraînement</button><button id="live" class="choice">📱 Livestream</button><button id="party" class="choice">🎉 Soirée</button><button id="vacation" class="choice">✈️ Vacances</button><button id="dating" class="choice hidden">❤️ Rencard</button><button id="gear" class="choice">👟 Équipement</button><button id="match" class="choice">🏈 Jouer un match</button><button id="offers" class="choice">🎓 Universités</button><button id="draft" class="choice hidden">🏆 Draft NFL</button></div><button id="next" class="btn">📅 +1 MOIS</button></div><div id="panel" class="card hidden"></div></section></main><script>"use strict";const $=id=>document.getElementById(id);let s={age:16,month:1,activities:0,fatigue:0,fans:1200,rep:50,conf:70,coach:60,gf:false,player:null,seen:new Set(),gear:{helmet:'Riddell SpeedFlex',cleats:'Nike Alpha Menace',gloves:'Nike Vapor Jet',pads:'Riddell',ball:'Wilson The Duke'}};const life=[['🏫 Lycée','Un professeur te demande de rattraper un devoir avant le prochain match.','Faire le devoir','Le repousser','Tu protèges tes résultats scolaires et rassures ton coach.','Tu prends du retard et le coach te rappelle que les études comptent aussi.'],['🏈 Coach','Ton coach te propose une séance vidéo supplémentaire.','Accepter','Refuser','Tu comprends mieux tes erreurs et montres ton sérieux.','Le coach note que tu refuses une occasion de progresser.'],['📱 Réseaux','Un clip de toi devient viral après un gros match.','Répondre aux fans','Ne rien poster','Tu construis une relation saine avec ton public.','Tu rates une occasion de créer du lien.'],['🩹 Corps','Une petite douleur apparaît après une séance.','Te reposer','Forcer','Tu évites d’aggraver la douleur.','La douleur augmente et ta charge est réduite.'],['🎓 Recruteur','Un recruteur universitaire observe ton entraînement.','Rester naturel','Forcer pour impressionner','Il apprécie ta discipline et ton vrai niveau.','Il remarque ton impatience.'],['🎙️ Journaliste','Un journaliste te demande qui est ton modèle.','Répondre sincèrement','Jouer un personnage','Ton interview paraît authentique.','La réponse semble fabriquée.'],['🎮 Ami','Un ami veut jouer toute la nuit avant un match.','Jouer raisonnablement','Jouer toute la nuit','Tu profites sans sacrifier ton sommeil.','Tu arrives fatigué le lendemain.'],['🍔 Alimentation','Après l’entraînement, tu as envie de fast-food.','Prendre un repas équilibré','Manger n’importe quoi','Ta récupération est meilleure.','Tu te sens lourd à la séance suivante.'],['📸 Média','Une chaîne locale veut filmer ton quotidien.','Accepter avec des limites','Tout montrer','Tu gagnes en visibilité tout en protégeant ta vie privée.','Tu exposes trop ton quotidien.'],['💰 Sponsor','Une petite marque veut te sponsoriser mais demande beaucoup de publications.','Négocier','Accepter tout de suite','Tu trouves un meilleur équilibre.','Ton emploi du temps devient trop chargé.'],['🏫 Notes','Tes notes baissent avec les entraînements.','Réorganiser ton planning','Ignorer','Tu évites que le problème s’installe.','Tu accumules du retard scolaire.'],['🧑‍🤝‍🧑 Équipe','Un nouveau joueur cherche sa place dans le groupe.','L’accueillir','L’ignorer','Le groupe devient plus soudé.','Il reste isolé.'],['🏆 Tournoi','Un tournoi régional attire des recruteurs.','Gérer ton énergie','Tout donner sans réfléchir','Tu restes performant sur toute la journée.','Tu es épuisé trop vite.'],['🎤 Rappeur','Un rappeur connu mentionne ton parcours dans une chanson.','Le remercier','Ne rien faire','La visibilité augmente et une relation peut naître.','Tu profites de la visibilité mais rates une occasion.'],['⭐ Streamer','Un streamer connu t’invite dans son live.','Accepter','Refuser','Ton audience augmente fortement.','Tu évites une distraction.'],['📄 Contrat','On te propose un contrat que tu ne comprends pas.','Demander conseil','Signer immédiatement','Tu comprends tes obligations avant de t’engager.','Tu découvres des contraintes plus tard.'],['🚌 Transport','Ton bus est en retard avant l’entraînement.','Prévenir le coach','Ne rien dire','Le coach apprécie ta communication.','Ton retard est mal interprété.'],['🧠 Pression','Des recruteurs seront dans les tribunes.','Jouer ton jeu','Chercher à impressionner à chaque action','Ta régularité attire leur attention.','Tu forces plusieurs actions.'],['🏈 Position','Le coach pense que tu pourrais tester une autre position.','Essayer','Refuser immédiatement','Tu découvres peut-être une nouvelle qualité.','Le coach respecte ton choix mais tu rates un essai.'],['🩺 Prévention','Le staff organise une séance de prévention des blessures.','Participer','Sécher','Tu apprends à mieux protéger ton corps.','Tu rates des conseils utiles.']];const matchEvents=[['🏈 Drive','La défense adverse vient de changer sa couverture.','Lire la défense','Forcer la passe profonde','Tu lis correctement la situation et gagnes des yards.','La défense intercepte ta tentative.'],['🔥 Pression','Le pass rush arrive très vite.','Prendre une décision rapide','Garder le ballon trop longtemps','Tu évites le sack et prolonges le drive.','Tu prends un sack et perds du terrain.'],['📣 Public','Le stade devient extrêmement bruyant sur un troisième down.','Rester concentré','Regarder les tribunes','Tu gardes ton calme malgré le bruit.','La communication avec tes coéquipiers devient plus difficile.'],['🩹 Contact','Tu prends un gros contact mais peux continuer.','Jouer plus prudemment','Chercher immédiatement un nouveau gros contact','Tu adaptes ton jeu et protèges ton corps.','Tu augmentes inutilement ta fatigue.'],['⏱️ Horloge','Il reste moins d’une minute et ton équipe est menée.','Gérer l’horloge','Prendre tout ton temps','Tu donnes à ton équipe une vraie chance de revenir.','Le chrono travaille contre toi.'],['🎯 Cible','Ton receveur préféré est couvert mais un autre est libre.','Changer de cible','Lancer quand même','Tu trouves le joueur démarqué.','La défense lit ton intention.'],['🌧️ Météo','Une forte pluie commence pendant le drive.','Sécuriser le ballon','Tenter une passe très risquée','Tu adaptes ton jeu aux conditions.','Le ballon devient difficile à contrôler.'],['🏃 Course','Un espace s’ouvre au milieu.','Prendre les yards disponibles','Chercher une action spectaculaire','Tu avances efficacement.','Tu rates une opportunité simple.'],['📺 Caméras','Les caméras montrent ton visage après une erreur.','Passer à l’action suivante','T’énerver','Tu montres une bonne réaction mentale.','Ta frustration se voit et perturbe ton jeu.'],['🧤 Réception','Ton receveur a les mains froides.','Lui donner une cible facile','Tenter une passe difficile','Tu aides ton coéquipier à reprendre confiance.','La passe est plus difficile à contrôler.'],['🧠 Coach','Le coach te donne un changement de jeu juste avant le snap.','Écouter et exécuter','Ignorer l’appel','Tu exécutes le plan.','Le mauvais choix crée une confusion.'],['🏆 Rival','Un défenseur te provoque après une action.','Ignorer','Répondre','Tu restes concentré.','Tu perds de l’énergie dans une confrontation inutile.'],['⭐ Scout','Tu aperçois un scout qui prend des notes.','Jouer normalement','Forcer une action pour lui','Ton vrai niveau parle pour toi.','Il remarque que tu cherches trop à impressionner.'],['💨 Fatigue','Tes jambes deviennent lourdes en fin de match.','Simplifier ton jeu','Continuer à prendre tous les risques','Tu limites les erreurs malgré la fatigue.','La fatigue provoque une mauvaise décision.'],['🏈 4e tentative','Ton équipe doit choisir entre tenter la quatrième tentative ou dégager.','Faire confiance au plan','Prendre une décision héroïque','Le choix colle à la situation et ton équipe garde ses chances.','Le risque ne paie pas.']];function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}function update(){if(!s.player)return;$('fans').textContent=s.fans.toLocaleString('fr-FR');$('rep').textContent=s.rep;$('conf').textContent=s.conf;$('coach').textContent=s.coach;$('fatbar').style.width=s.fatigue+'%';$('date').textContent='Âge '+s.age+' ans · Mois '+s.month;$('status').textContent=(3-s.activities)+' activité(s) restante(s) · Fatigue '+s.fatigue+'/100';$('dating').classList.toggle('hidden',!s.gf);$('draft').classList.toggle('hidden',s.age<21)}function hub(){hide('panel');show('hub');update()}function use(){if(s.activities>=3){alert('Tu as utilisé tes 3 activités ce mois-ci. Passe au mois suivant.');return false}s.activities++;return true}function outcome(ok,title,text){hide('hub');show('panel');$('panel').innerHTML='<span class="tag">'+(ok?'CHOIX POSITIF':'CHOIX NÉGATIF')+'</span><h2>'+title+'</h2><div class="'+(ok?'good':'bad')+'"><b>'+(ok?'✓ Bon choix':'✕ Mauvais choix')+'</b><br>'+text+'</div><button class="btn" id="back">Continuer</button>';$('back').onclick=hub;update()}$('height').oninput=()=>{$('hv').textContent=(+$('height').value/100).toFixed(2).replace('.',',')+' m'};$('weight').oninput=()=>{$('wv').textContent=$('weight').value+' kg'};$('start').onclick=()=>{let h=+$('height').value,w=+$('weight').value;s.player={first:$('first').value.trim()||'Jayden',last:$('last').value.trim()||'Carter',height:h,weight:w,pos:$('pos').value,city:$('city').value,school:$('school').value};$('player').textContent=s.player.first+' '+s.player.last;$('mini').textContent=(h/100).toFixed(2).replace('.',',')+' m · '+w+' kg · '+s.player.pos;$('profile').textContent=s.player.city+' · '+s.player.school+' · '+s.player.pos+' · '+(h/100).toFixed(2)+' m · '+w+' kg';let ideals={Quarterback:185,'Running Back':178,'Wide Receiver':183,Cornerback:180,Linebacker:188,'Defensive End':193,'Offensive Lineman':193,Kicker:180},good=Math.abs(h-ideals[s.player.pos])<=5;s.coach+=good?5:-3;$('coachNote').textContent=good?'Le coach estime que ton gabarit correspond bien à ton poste.':'Le coach trouve ton gabarit atypique pour ce poste. Tu devras compenser avec ta technique.';hide('creator');show('career');hub()};$('statsBtn').onclick=()=>$('stats').classList.toggle('hidden');$('train').onclick=()=>{if(!use())return;hide('hub');show('panel');$('panel').innerHTML='<h2>🏋️ Entraînement</h2><p>Choisis ta séance.</p><button class="choice tr">💪 Musculation</button><button class="choice tr">🫀 Cardio</button><button class="choice tr">🏃 Tapis de course</button><button class="choice tr">🏈 Exercices de lancer</button><button class="choice tr">⚡ Agilité</button><button class="choice tr">👐 Réception</button><button class="choice tr">🛡️ Placages</button>';document.querySelectorAll('.tr').forEach(b=>b.onclick=()=>{let n=b.textContent;let f=n.includes('Musculation')?12:n.includes('Cardio')?8:7;s.fatigue=Math.min(100,s.fatigue+f);s.conf+=5;s.rep+=3;outcome(true,n,'Bonne séance. Tes qualités progressent, mais ta fatigue monte à '+s.fatigue+'/100.')})};$('live').onclick=()=>{if(!use())return;hide('hub');show('panel');$('panel').innerHTML='<h2>📱 Livestream</h2><button class="choice lv">🎮 Live gaming</button><button class="choice lv">💬 Just Chatting</button><button class="choice lv">🏈 Analyse football</button><button class="choice lv">🔥 Défi sportif</button><button class="choice lv">⭐ Apparition dans le live d’un streamer connu</button>';document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{s.rep+=6;s.fans+=500;outcome(true,b.textContent,'Le public accroche. Ta visibilité augmente et de nouveaux fans arrivent.')})};$('party').onclick=()=>{if(!use())return;s.fans+=250;s.rep+=3;s.fatigue=Math.min(100,s.fatigue+4);outcome(true,'🎉 Soirée','Tu rencontres des gens du milieu sportif. Tu gagnes en visibilité mais rentres plus tard.')};$('vacation').onclick=()=>{if(!use())return;s.fatigue=Math.max(0,s.fatigue-22);s.conf+=5;outcome(true,'✈️ Vacances','Tu récupères mentalement et physiquement avant la suite de la saison.')};$('dating').onclick=()=>{if(!s.gf)return;if(!use())return;s.conf+=7;outcome(true,'❤️ Rencard','Vous passez un bon moment. La relation devient plus solide.')};$('gear').onclick=()=>gearMenu();function gearMenu(){hide('hub');show('panel');let sets={Casques:[['Riddell SpeedFlex','Riddell','https://images.unsplash.com/photo-1566577739112-5180d4bf9390?auto=format&fit=crop&w=500&q=80'],['Schutt F7 AiR','Schutt','https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=500&q=80'],['VICIS ZERO2','VICIS','https://images.unsplash.com/photo-1580748141549-71748dbe0c4c?auto=format&fit=crop&w=500&q=80']],Crampons:[['Nike Alpha Menace','Nike','https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80'],['adidas Adizero','adidas','https://images.unsplash.com/photo-1608231387042-66d1773070a5?auto=format&fit=crop&w=500&q=80'],['Under Armour Spotlight','Under Armour','https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=500&q=80']],Gants:[['Nike Vapor Jet','Nike','https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=500&q=80'],['adidas Freak','adidas','https://images.unsplash.com/photo-1511886929837-354d827aae26?auto=format&fit=crop&w=500&q=80'],['Cutters REV PRO','Cutters','https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=500&q=80']],Protections:[['Riddell Shoulder Pads','Riddell','https://images.unsplash.com/photo-1577223625816-7546f13df25d?auto=format&fit=crop&w=500&q=80'],['Schutt Shoulder Pads','Schutt','https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=500&q=80'],['Douglas Shoulder Pads','Douglas','https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=500&q=80']],Ballons:[['Wilson The Duke','Wilson','https://images.unsplash.com/photo-1566577739112-5180d4bf9390?auto=format&fit=crop&w=500&q=80'],['Nike Vapor','Nike','https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=500&q=80'],['adidas Football','adidas','https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=500&q=80']]};let html='<h2>👟 Équipement</h2><p>Avant d’avoir un sponsor, tu peux choisir librement ton équipement.</p>';for(let cat in sets){html+='<h3>'+cat+'</h3><div class="geargrid">';sets[cat].forEach((x,i)=>{html+='<div class="gear"><img src="'+x[2]+'" alt="'+x[0]+'"><h3>'+x[0]+'</h3><small>'+x[1]+'</small><button class="choice pick" data-cat="'+cat+'" data-name="'+x[0]+'">Choisir</button></div>'});html+='</div>'}html+='<button class="btn" id="gearBack">Retour</button>';$('panel').innerHTML=html;document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{s.gear[b.dataset.cat]=b.dataset.name;b.textContent='✓ Équipé';b.disabled=true;s.fans+=20});$('gearBack').onclick=hub}function match(){if(!use())return;hide('hub');show('panel');let used=[];let score=0;function next(){if(used.length>=3){finish();return}let pool=matchEvents.filter((_,i)=>!used.includes(i));let idx=Math.floor(Math.random()*pool.length);let e=pool[idx];let real=matchEvents.indexOf(e);used.push(real);$('panel').innerHTML='<span class="tag">ÉVÉNEMENT DE MATCH '+(used.length)+'/3</span><h2>'+e[0]+'</h2><p>'+e[1]+'</p><button class="choice" id="m1">'+e[2]+'</button><button class="choice" id="m2">'+e[3]+'</button>';$('m1').onclick=()=>pick(true,e[4]);$('m2').onclick=()=>pick(false,e[5])}function pick(good,text){if(good){score+=6;s.rep+=3;s.fans+=180;s.conf+=3}else{score-=3;s.rep=Math.max(0,s.rep-2);s.conf-=4}s.fatigue=Math.min(100,s.fatigue+3);$('panel').innerHTML='<div class="'+(good?'good':'bad')+'"><b>'+(good?'✓ Bonne décision':'✕ Mauvaise décision')+'</b><br>'+text+'</div><button class="btn" id="continueMatch">Continuer le match</button>';$('continueMatch').onclick=next}function finish(){let fatiguePenalty=s.fatigue>=75?5:0;score-=fatiguePenalty;let win=score>=12;s.rep+=win?10:2;s.fans+=win?800:150;s.coach+=win?5:-3;s.fatigue=Math.min(100,s.fatigue+7);$('panel').innerHTML='<h2>'+(win?'🏆 Victoire':'😬 Défaite')+'</h2><p>Score de performance : <b>'+score+'</b>'+(fatiguePenalty?' · '+fatiguePenalty+' points retirés à cause de la fatigue.':'')+'</p><p>'+(win?'Ton match attire l’attention et ta régularité commence à payer.':'Tu as des choses à corriger. Le coach veut voir une réaction au prochain match.')+'</p><button class="btn" id="afterMatch">🎙️ Interview d’après-match</button>';$('afterMatch').onclick=()=>interview(win)}next()}function interview(win){$('panel').innerHTML='<h2>🎙️ Interview</h2><p>Un journaliste te tend le micro. Comment réponds-tu ?</p><button class="choice" onclick="interviewResult(5,\'Tu restes humble et mets l’équipe en avant.\')">Rester humble</button><button class="choice" onclick="interviewResult(7,\'Tu assumes tes ambitions sans manquer de respect.\')">Assumer mes ambitions</button><button class="choice" onclick="interviewResult(4,\'Tu remercies tes coéquipiers et le staff.\')">Remercier l’équipe</button>}function interviewResult(r,t){s.rep+=r;s.fans+=r*80;outcome(true,'🎙️ Interview terminée',t)}$('offers').onclick=()=>{hide('hub');show('panel');$('panel').innerHTML='<h2>🎓 Universités</h2><p>'+(s.age<18?'Les recruteurs commencent seulement à suivre ton profil. Continue à progresser.':s.rep>=90?'Plusieurs programmes commencent à te surveiller.':'Tu dois encore augmenter ta réputation.')+'</p><button class="btn" id="b">Retour</button>';$('b').onclick=hub};$('draft').onclick=()=>{hide('hub');show('panel');let ready=s.age>=21&&s.rep>=140&&s.coach>=90;$('panel').innerHTML='<h2>🏆 Draft NFL</h2><p>'+(ready?'Tu es éligible et les scouts te suivent sérieusement.':'Tu n’es pas encore prêt. Il te faut plus de réputation, de confiance du coach et atteindre l’âge éligible.')+'</p>'+(ready?'<button class="btn" id="enter">Entrer dans la Draft</button>':'')+'<button class="btn" id="b">Retour</button>';$('b').onclick=hub;if(ready)$('enter').onclick=()=>{s.fans+=5000;s.rep+=30;$('panel').innerHTML='<h2>🎉 Tu es drafté !</h2><p>'+s.player.first+' '+s.player.last+' rejoint la NFL après une sélection au '+Math.max(1,Math.min(7,Math.floor(s.rep/25)))+'e tour.</p><button class="btn" id="b">Continuer</button>';$('b').onclick=hub}};$('next').onclick=()=>{s.month++;s.activities=0;s.fatigue=Math.max(0,s.fatigue-18);if(s.month>12){s.month=1;s.age++;if(s.age>=18)s.rep+=2}update();let pool=life.filter((_,i)=>!s.seen.has(i));if(!pool.length){s.seen.clear();pool=life}let e=pool[Math.floor(Math.random()*pool.length)],idx=life.indexOf(e);s.seen.add(idx);hide('hub');show('panel');$('panel').innerHTML='<span class="tag">'+e[0]+'</span><h2>'+e[1]+'</h2><button class="choice" id="l1">'+e[2]+'</button><button class="choice" id="l2">'+e[3]+'</button>';$('l1').onclick=()=>{s.rep+=4;s.conf+=4;s.fans+=120;outcome(true,'Bonne décision',e[4])};$('l2').onclick=()=>{s.rep=Math.max(0,s.rep-2);s.conf-=4;s.coach=Math.max(0,s.coach-2);outcome(false,'Mauvaise décision',e[5])}};update();</script></body></html>
