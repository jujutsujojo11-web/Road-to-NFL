<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to NFL</title><style>body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#121823;border:1px solid #293342;border-radius:16px;padding:18px;margin:14px 0}.hidden{display:none!important}.btn,.choice{width:100%;padding:14px;margin:7px 0;border:0;border-radius:9px;background:#ff5b22;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.choice{background:#202936;text-align:left}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#090c11;padding:10px;border-radius:8px}.good{padding:14px;border-radius:9px;background:#123b24;color:#a5ffc3;margin-top:10px}.bad{padding:14px;border-radius:9px;background:#40171b;color:#ff9aa5;margin-top:10px}.gearGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gear{background:#0b1018;border:1px solid #303b4c;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}.gear.selected{border-color:#ff5b22;box-shadow:0 0 0 1px #ff5b22}.gear img{width:130px;height:100px;object-fit:contain;background:#fff;border-radius:10px}.gear h3{margin:0 0 4px}.tag{font-size:12px;color:#aeb8c7}.brand{font-weight:bold;color:#ff8b62}.source{font-size:11px;color:#8e9bad;margin-top:5px}@media(max-width:600px){.grid,.stats,.gearGrid{grid-template-columns:1fr 1fr}.gear{display:block}.gear img{width:100%;height:130px}input,select{font-size:16px}}</style></head><body><main class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><section id="creator" class="card"><h2>Créer ton joueur</h2><input id="first" placeholder="Prénom" value="Jayden" style="width:100%;box-sizing:border-box;padding:13px"><br><br><input id="last" placeholder="Nom" value="Carter" style="width:100%;box-sizing:border-box;padding:13px"><p>Taille : <b id="hv">1,80 m</b></p><input id="height" type="range" min="170" max="200" value="180" style="width:100%"><p>Poids : <b id="wv">85 kg</b></p><input id="weight" type="range" min="60" max="150" value="85" style="width:100%"><select id="pos" style="width:100%;padding:13px;margin-top:10px"><option>Quarterback</option><option>Running Back</option><option>Wide Receiver</option><option>Cornerback</option><option>Linebacker</option><option>Defensive End</option><option>Offensive Lineman</option><option>Kicker</option></select><select id="city" style="width:100%;padding:13px;margin-top:10px"><option>New York</option><option>Los Angeles</option><option>Miami</option><option>Dallas</option><option>Atlanta</option><option>Chicago</option><option>Houston</option></select><select id="school" style="width:100%;padding:13px;margin-top:10px"><option>Lincoln High School</option><option>Central High School</option><option>Westside High School</option><option>Eastview High School</option></select><button id="start" class="btn" type="button">Valider mon joueur</button><div id="err" class="bad hidden"></div></section><section id="career" class="hidden"><div class="card"><h2 id="player">Ton joueur</h2><p id="mini"></p><button id="statsBtn" class="choice">📊 Voir mes statistiques</button><div id="stats" class="hidden"><p id="profile"></p><p id="coachNote"></p><div class="stats"><div class="stat">Fans<br><b id="fans">1200</b></div><div class="stat">Réputation<br><b id="rep">50</b></div><div class="stat">Confiance<br><b id="conf">70</b></div><div class="stat">Coach<br><b id="coach">60</b></div></div></div></div><div id="hub" class="card"><h2>Carrière</h2><p id="date"></p><p id="status"></p><div class="grid"><button id="train" class="choice">🏋️ Entraînement</button><button id="live" class="choice">📱 Livestream</button><button id="party" class="choice">🎉 Soirée</button><button id="vacation" class="choice">✈️ Vacances</button><button id="gearBtn" class="choice">👟 Équipement</button><button id="match" class="choice">🏈 Match</button><button id="offers" class="choice">🎓 Universités</button><button id="dating" class="choice hidden">❤️ Rencard</button><button id="draft" class="choice hidden">🏆 Draft NFL</button></div><button id="next" class="btn">📅 +1 MOIS</button></div><div id="panel" class="card hidden"></div></section></main><script>"use strict";var state={age:16,month:1,activities:0,fatigue:0,fans:1200,rep:50,conf:70,coach:60,gf:false,player:null,equipment:{helmet:'Riddell SpeedFlex',cleats:'Nike Alpha Menace 4 Shark',gloves:'Nike Vapor Jet 9.0',pads:'Riddell Smoke',ball:'Wilson The Duke'}};function E(id){return document.getElementById(id)}function show(id){E(id).classList.remove('hidden')}function hide(id){E(id).classList.add('hidden')}function hub(){hide('panel');show('hub');E('date').textContent='Âge '+state.age+' · Mois '+state.month;E('status').textContent=(3-state.activities)+' activité(s) restante(s) · Fatigue '+state.fatigue+'/100';E('dating').classList.toggle('hidden',!state.gf);E('draft').classList.toggle('hidden',state.age<21);update()}function update(){E('fans').textContent=state.fans.toLocaleString('fr-FR');E('rep').textContent=state.rep;E('conf').textContent=state.conf;E('coach').textContent=state.coach}function use(){if(state.activities>=3){E('status').textContent='Tu as déjà utilisé tes 3 activités ce mois-ci.';return false}state.activities++;return true}function message(ok,text){hide('hub');E('panel').innerHTML='<div class="'+(ok?'good':'bad')+'"><b>'+(ok?'✓ Bon choix':'✕ Mauvais choix')+'</b><br>'+text+'</div><button id="back" class="btn">Continuer</button>';show('panel');E('back').onclick=hub}function startGame(){try{var h=Number(E('height').value),w=Number(E('weight').value);if(!Number.isFinite(h)||h<170)h=180;if(!Number.isFinite(w)||w<60)w=85;state.player={first:E('first').value.trim()||'Jayden',last:E('last').value.trim()||'Carter',height:h,weight:w,pos:E('pos').value||'Quarterback',city:E('city').value||'New York',school:E('school').value||'Lincoln High School'};E('player').textContent=state.player.first+' '+state.player.last;E('mini').textContent=(state.player.height/100).toFixed(2).replace('.',',')+' m · '+state.player.weight+' kg · '+state.player.pos;E('profile').textContent=state.player.city+' · '+state.player.school+' · '+state.player.pos+' · '+(state.player.height/100).toFixed(2)+' m · '+state.player.weight+' kg';var ideals={Quarterback:185,'Running Back':178,'Wide Receiver':183,Cornerback:180,Linebacker:188,'Defensive End':193,'Offensive Lineman':193,Kicker:180};var ideal=ideals[state.player.pos]||183;var good=Math.abs(state.player.height-ideal)<=5;state.coach+=good?5:-3;E('coachNote').textContent=good?'Le coach trouve ton gabarit adapté à ton poste.':'Le coach pense que ton gabarit est atypique pour ce poste. Tu devras compenser avec ta technique.';hide('creator');show('career');hub()}catch(e){E('err').textContent='Erreur : '+e.message;show('err')}}E('height').oninput=function(){E('hv').textContent=(Number(this.value)/100).toFixed(2).replace('.',',')+' m'};E('weight').oninput=function(){E('wv').textContent=this.value+' kg'};E('start').onclick=startGame;E('statsBtn').onclick=function(){E('stats').classList.toggle('hidden')};E('train').onclick=function(){if(!use())return;hide('hub');show('panel');E('panel').innerHTML='<h2>🏋️ Entraînement</h2><p>Choisis ta séance.</p><button class="choice t">💪 Musculation</button><button class="choice t">🫀 Cardio</button><button class="choice t">🏃 Tapis de course</button><button class="choice t">🏈 Exercices de lancer</button><button class="choice t">⚡ Agilité</button>';document.querySelectorAll('.t').forEach(function(b){b.onclick=function(){state.fatigue=Math.min(100,state.fatigue+(b.textContent.includes('Musculation')?10:6));state.conf+=5;state.rep+=3;message(true,b.textContent+' : bonne séance. Tu progresses, mais ta fatigue monte à '+state.fatigue+'/100.')}})};E('live').onclick=function(){if(!use())return;hide('hub');show('panel');E('panel').innerHTML='<h2>📱 Livestream</h2><button class="choice l">🎮 Gaming</button><button class="choice l">💬 Discussion</button><button class="choice l">🏈 Analyse football</button><button class="choice l">🔥 Défi sportif</button><button class="choice l">⭐ Apparition dans le live d’un streamer connu</button>';document.querySelectorAll('.l').forEach(function(b){b.onclick=function(){state.rep+=6;state.fans+=500;message(true,b.textContent+' : ton live attire de nouveaux spectateurs.')}})};E('dating').onclick=function(){if(!state.gf)return;if(!use())return;state.conf+=6;message(true,'Le rendez-vous s’est bien passé. Votre relation se renforce.')};E('party').onclick=function(){if(!use())return;state.fans+=300;state.rep+=5;message(true,'La soirée te permet de rencontrer de nouvelles personnes et augmente ta visibilité.')};E('vacation').onclick=function(){if(!use())return;state.fatigue=Math.max(0,state.fatigue-20);state.conf+=6;message(true,'Les vacances te permettent de récupérer. Ta fatigue diminue.')};E('gearBtn').onclick=function(){hide('hub');show('panel');renderGear()};var gearData={helmet:[['Riddell SpeedFlex','Riddell','https://cdn11.bigcommerce.com/s-qq5h9nclzt/images/stencil/original/image-manager/fast-shippping.jpg?t=1762965648','https://www.riddell.com/'],['Schutt F7 AiR','Schutt','https://acdn.mitiendanube.com/stores/070/449/products/schutt-31-16d92b1064699e4fcc16541132412814-1024-1024.png','https://schuttsports.com/fr/products/f7-air-helmet'],['Xenith Shadow XR','Xenith','https://130659756.cdn6.editmysite.com/uploads/1/3/0/6/130659756/s353326880574977434_p997_i1_w1100.jpeg','https://xenith.com/'],['VICIS ZERO2','VICIS','https://vicis.com/cdn/shop/files/ZERO2WHSO212EWHProfile.544_1800x.png?v=1747333007','https://vicis.com/products/zero2-helmet?srsltid=AfmBOoruiSLMcNamMBKUuadtMu7KxCuArEi_FvdQ_id_L_maiSlBfL8O']],cleats:[['Nike Alpha Menace 4 Shark','Nike','https://classic.cdn.media.amplience.net/i/hibbett/00AZH_0201_right','https://www.nike.com/t/alpha-menace-4-shark-football-cleats-GFaKuj8O/HV8056-101'],['adidas Adizero Electric II','adidas','https://academy.scene7.com/is/image/academy/og-image/21607042','https://www.adidas.com/us/adizero-football-cleats'],['UA Spotlight Pro','Under Armour','https://underarmour.scene7.com/is/image/Underarmour/6013229-100_DEFAULT?bgc=f0f0f0&hei=1000&op_usm=1.75%2C0.3%2C2%2C0&qlt=85&rp=standard-30pad%7Cpdp&size=770%2C970&wid=800','https://www.underarmour.ca/en-ca/p/ua_spotlight_pro_football_cleats/6013229.html'],['New Balance FreezeLX v5','New Balance','https://images.stockx.com/images/New-Balance-FreezeLX-v5-Liquid-Silver-White-Silver-Shoreline-Blue.jpg?bg=FFFFFF&dpr=2&fit=fill&h=384&q=57&trim=color&updated_at=1763028467&w=576','https://www.newbalance.com/']],gloves:[['Nike Vapor Jet 9.0','Nike','https://images.dickssportinggoods.com/is/image/dkscdn/25NIKAFOOTVJ90FGBLBLS_White_White_Game_Royal_is','https://www.nike.com/t/vapor-jet-9-football-gloves-1-pair-NjwHvI9H/N1013383-091'],['adidas Freak Max 2.0','adidas','https://zandrodiaz.com/wp-content/uploads/2023/05/Adidas-Freak-Max-2.0-1024x972.jpeg','https://www.adidas.com/'],['Under Armour F7','Under Armour','https://i.ebayimg.com/images/g/PncAAeSw92xpCMC4/s-l960.jpg','https://www.underarmour.com/'],['Cutters REV PRO 6.0','Cutters','https://images.dickssportinggoods.com/is/image/dkscdn/24CUTARVPR60RCVRGFTC_Black_is','https://cuttersgloves.com/']],pads:[['Riddell Smoke','Riddell','https://cdn11.bigcommerce.com/s-qq5h9nclzt/images/stencil/2560w/products/581799/245350/riddell-smoke-adult-football-shoulder-pads-skill-position_altimage-01_Full__20681.1700253604.jpg?c=1','https://www.riddell.com/riddell/en/Open-Catalogue/Shoulder-Pads/Varsity/Smoke-/SMOKE-AP/p/R48343'],['Schutt Shoulder Pads','Schutt','https://i5.walmartimages.com/asr/ab5a597d-d8a1-4a4b-acbb-4b3787cf6a0d.387bc78f195a0fc093f54cc5a6e63aaf.jpeg?odnBg=FFFFFF&odnHeight=768&odnWidth=768','https://schuttsports.com/'],['Douglas Destroyer 2.0','Douglas','https://www.forelle.com/media/catalog/product/cache/1/image/1200x1200/602f0fa2c1f0d1ba5e241f914e856ff9/d/o/douglas_destroyer_2.0.jpg','https://www.forelle.com/fr_FR/epaulieres/267/'],['Riddell Power SPK+','Riddell','https://cdn11.bigcommerce.com/s-qq5h9nclzt/images/stencil/2560w/products/581799/245350/riddell-smoke-adult-football-shoulder-pads-skill-position_altimage-01_Full__20681.1700253604.jpg?c=1','https://www.riddell.com/']],ball:[['Wilson The Duke','Wilson','https://www.wilson.com/en-us/product/the-duke-official-nfl-football-wf1000','https://www.wilson.com/'],['Wilson GST','Wilson','https://www.wilson.com/','https://www.wilson.com/'],['Nike Vapor 1X','Nike','https://www.nike.com/','https://www.nike.com/'],['adidas adiZero','adidas','https://www.adidas.com/','https://www.adidas.com/']]};function renderGear(){var html='<h2>👟 Personnalisation de l’équipement</h2><p>Avant d’avoir un sponsor, tu peux choisir librement ton matériel. Ici, les images montrent de vrais modèles de marques existantes. Les marques et images restent la propriété de leurs détenteurs.</p>';Object.keys(gearData).forEach(function(type){html+='<h3>'+({helmet:'🪖 Casques',cleats:'👟 Chaussures',gloves:'🧤 Gants',pads:'🛡️ Épaulières',ball:'🏈 Ballons'}[type])+'</h3><div class="gearGrid">';gearData[type].forEach(function(g,i){var sel=state.equipment[type]===g[0]?' selected':'';html+='<div class="gear'+sel+'"><img src="'+g[2]+'" alt="'+g[0]+'"><div><h3>'+g[0]+'</h3><div class="brand">'+g[1]+'</div><div class="tag">'+(sel?'✓ Équipé':'Disponible')+'</div><button class="choice" onclick="equip(\''+type+'\','+i+')">Choisir</button><a class="source" href="'+g[3]+'" target="_blank" rel="noopener">Voir le produit</a></div></div>'});html+='</div>'});html+='<button class="btn" onclick="hub()">Retour à la carrière</button>';E('panel').innerHTML=html}function equip(type,i){state.equipment[type]=gearData[type][i][0];renderGear();var n=document.createElement('div');n.className='good';n.innerHTML='✓ Équipement équipé : <b>'+state.equipment[type]+'</b>';E('panel').prepend(n)}E('match').onclick=function(){if(!use())return;hide('hub');show('panel');var penalty=state.fatigue>=75?4:0;E('panel').innerHTML='<h2>🏈 Match</h2><p>Fatigue : '+state.fatigue+'/100</p><button id="play" class="btn">Jouer</button>';E('play').onclick=function(){var points=Math.max(1,18-penalty);state.fans+=600;state.rep+=points>=15?8:2;state.coach+=points>=15?5:-2;message(points>=15,'Performance : '+points+' points.'+(penalty?' Ta fatigue élevée a réduit ta performance.':''))}};E('offers').onclick=function(){hide('hub');show('panel');E('panel').innerHTML='<h2>🎓 Universités</h2><p>'+(state.age<18?'Les recruteurs commencent à te surveiller.':'Tes performances peuvent attirer des universités.')+'</p><button class="btn" id="back">Retour</button>';E('back').onclick=hub};E('next').onclick=function(){state.month++;state.activities=0;state.fatigue=Math.max(0,state.fatigue-15);if(state.month>12){state.month=1;state.age++}hub();hide('hub');show('panel');E('panel').innerHTML='<h2>Nouvelle situation</h2><p>Un événement de ta vie vient de se produire. Tu peux continuer ta carrière.</p><button class="btn" id="back">Continuer</button>';E('back').onclick=hub};E('draft').onclick=function(){hide('hub');show('panel');E('panel').innerHTML='<h2>🏆 Draft NFL</h2><p>La Draft devient accessible à partir de 21 ans.</p><button class="btn" id="back">Retour</button>';E('back').onclick=hub};</script></body></html>
