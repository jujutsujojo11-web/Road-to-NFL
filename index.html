<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to NFL</title><style>body{margin:0;background:#07090d;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:20px}.card{background:#121823;border:1px solid #293342;border-radius:16px;padding:20px;margin:15px 0}.hide{display:none!important}.btn,.choice{display:block;width:100%;box-sizing:border-box;padding:14px;margin:9px 0;border:0;border-radius:9px;background:#ff5b22;color:#fff;font-weight:700;cursor:pointer}.choice{text-align:left;background:#202936}input,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;background:#090d13;color:#fff;border:1px solid #334052;border-radius:8px}label{display:block;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{background:#090c11;padding:10px;border-radius:9px}.stat b{display:block;font-size:18px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}small{color:#aeb8c7}h1{font-size:38px}</style></head><body><main class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><section id="creator" class="card"><h2>Créer ton joueur</h2><input id="first" placeholder="Prénom" value="Jayden"><input id="last" placeholder="Nom" value="Carter"><label>Taille : <b id="heightVal">1.80 m</b></label><input id="height" type="range" min="170" max="200" value="180"><label>Poids : <b id="weightVal">85 kg</b></label><input id="weight" type="range" min="60" max="150" value="85"><select id="origin"><option>Quartier</option><option>Banlieue</option><option>Famille sportive</option><option>Petite ville</option><option>Académie sportive</option><option>Famille aisée</option></select><select id="city"><option>New York</option><option>Los Angeles</option><option>Miami</option><option>Dallas</option><option>Atlanta</option><option>Chicago</option><option>Houston</option><option>Seattle</option><option>Detroit</option><option>Philadelphia</option></select><select id="school"><option>Lincoln High School</option><option>Central High School</option><option>Westside High School</option><option>Eastview High School</option><option>Northside High School</option></select><select id="pos"><option>Quarterback</option><option>RunningBack</option><option>WideReceiver</option><option>Cornerback</option><option>Linebacker</option><option>DefensiveEnd</option><option>OffensiveLineman</option><option>Kicker</option></select><button id="startBtn" class="btn">Valider mon joueur</button></section><section id="career" class="hide"><div class="card"><h2 id="name"></h2><p id="profile"></p><p id="coachNote"></p><div class="stats"><div class="stat"><b id="fans">1200</b><small>Fans</small></div><div class="stat"><b id="rep">50</b><small>Réputation</small></div><div class="stat"><b id="conf">70</b><small>Confiance</small></div><div class="stat"><b id="coach">60</b><small>Coach</small></div><div class="stat"><b id="college">0</b><small>Offres</small></div><div class="stat"><b id="fatigue">0</b><small>Fatigue</small></div></div></div><div id="hub" class="screen card"><h2>Vie privée · Football</h2><p id="date"></p><p id="msg"></p><div class="grid"><button id="trainBtn" class="choice">🏋️ Entraînement</button><button id="dateBtn" class="choice">❤️ Aller en rencard</button><button id="partyBtn" class="choice">🎉 Soirée</button><button id="liveBtn" class="choice">📱 Livestream</button><button id="vacationBtn" class="choice">✈️ Vacances</button><button id="matchBtn" class="choice">🏈 Jouer un match</button><button id="offersBtn" class="choice">🎓 Offres universitaires</button><button id="draftMenuBtn" class="choice">🏆 Draft NFL</button></div><button id="monthBtn" class="btn">📅 +1 MOIS</button></div><div id="activity" class="screen card hide"><h2 id="activityTitle"></h2><p id="activityText"></p><div id="activityChoices"></div><button class="btn" id="continueBtn">Retour</button></div><div id="match" class="screen card hide"><h2>🏈 Match</h2><p id="matchText"></p><div id="matchChoices"></div></div><div id="event" class="screen card hide"><h2>🎲 Événement du mois</h2><h3 id="eventTitle"></h3><p id="eventText"></p><div id="eventChoices"></div></div><div id="result" class="screen card hide"><h2 id="resultTitle"></h2><p id="resultText"></p><button class="btn" id="resultNext">Continuer</button></div><div id="offers" class="screen card hide"><h2>🎓 Offres universitaires</h2><div id="offerList"></div><button class="btn" onclick="hub()">Retour</button></div><div id="draft" class="screen card hide"><h2>🏆 Draft NFL</h2><p id="draftText"></p><button class="btn" id="draftBtn">Continuer</button></div><div id="over" class="screen card hide"><h2>🚨 Fin de carrière</h2><p id="overText"></p><button class="btn" onclick="location.reload()">Recommencer</button></div></section></main><script src="app.js?v=8"></script></body></html>
