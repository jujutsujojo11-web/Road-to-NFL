<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROAD TO NFL</title><style>body{margin:0;background:#07090d;color:#fff;font-family:system-ui,Arial;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:40px 20px}h1{font-size:44px;margin-bottom:8px}.card{background:#111722;border:1px solid #293242;border-radius:18px;padding:24px;margin-top:20px}label{display:block;margin:14px 0 6px;color:#aeb8c7}input,select{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #303b4d;background:#080b10;color:#fff}.btn{margin-top:20px;padding:14px 20px;border:0;border-radius:9px;background:#ff5b22;color:#fff;font-weight:800;cursor:pointer}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#090c11;border:1px solid #252e3c;border-radius:10px;padding:14px}.stat b{display:block;font-size:20px}.muted{color:#9ca6b5}.choice{display:block;width:100%;margin:10px 0;padding:14px;border-radius:9px;border:1px solid #303b4d;background:#171e29;color:white;text-align:left;font-weight:700;cursor:pointer}.choice:hover{border-color:#ff5b22}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:34px}}</style></head><body><div class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><p class="muted">Crée ton joueur et commence ta carrière.</p><div id="creator" class="card"><h2>Créer ton joueur</h2><label>Prénom</label><input id="first" value="Jayden"><label>Nom</label><input id="last" value="Carter"><label>Ethnie / apparence</label><select id="eth"><option>Afro-américaine</option><option>Européenne</option><option>Latino-américaine</option><option>Asiatique</option><option>Arabe / moyen-orientale</option><option>Métisse</option><option>Autre</option></select><label>Poste</label><select id="pos"><option>Quarterback</option><option>Running Back</option><option>Wide Receiver</option><option>Cornerback</option><option>Linebacker</option><option>Defensive End</option><option>Offensive Lineman</option><option>Kicker</option></select><button class="btn" onclick="createPlayer()">Valider mon joueur</button><p id="saveMsg" class="muted"></p></div><div id="career" class="card hidden"><h2 id="welcome"></h2><p class="muted">Saison High School · Match 1</p><div class="stats"><div class="stat"><b id="fans">1200</b><small>Fans</small></div><div class="stat"><b id="rep">50</b><small>Réputation</small></div><div class="stat"><b id="conf">70</b><small>Confiance</small></div><div class="stat"><b id="coach">60</b><small>Coach</small></div></div><div id="match" class="card"><h3 id="eventTitle">Événement 1 / 3</h3><p id="eventText" class="muted">Ton équipe commence avec le ballon. La défense est haute. Que fais-tu ?</p><div id="choices"></div></div><div id="interview" class="card hidden"><h3>🎙️ Interview d'après-match</h3><p id="question"></p><div id="answers"></div></div></div></div><script>let player=null,eventIndex=0,score=0,stats={fans:1200,rep:50,conf:70,coach:60};const events=[{t:'Événement 1 / 3',q:'Ton équipe commence avec le ballon. La défense est haute. Que fais-tu ?',c:[['Passe profonde',7,5,2],['Passe courte',3,3,4],['Course improvisée',4,4,3]]},{t:'Événement 2 / 3',q:'Un défenseur te provoque devant les caméras. Comment réagis-tu ?',c:[['Ignorer',0,5,5],['Répondre',2,7,-2],['Le défier',7,6,-5]]},{t:'Événement 3 / 3',q:'Il reste 20 secondes. Ton équipe perd 24-21. Le coach te dit : « C’est ton moment. »',c:[['Passe longue',7,10,8],['Jeu sécurisé',3,3,4],['Tenter l’impossible',10,8,-3]]}];function createPlayer(){player={first:document.getElementById('first').value.trim()||'Jayden',last:document.getElementById('last').value.trim()||'Carter',eth:document.getElementById('eth').value,pos:document.getElementById('pos').value};localStorage.setItem('roadToNFLPlayer',JSON.stringify(player));document.getElementById('creator').classList.add('hidden');document.getElementById('career').classList.remove('hidden');document.getElementById('welcome').textContent='Bienvenue '+player.first+' '+player.last+' !';eventIndex=0;score=0;renderEvent()}function renderEvent(){let e=events[eventIndex];document.getElementById('eventTitle').textContent=e.t;document.getElementById('eventText').textContent=e.q;let box=document.getElementById('choices');box.innerHTML='';e.c.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x[0];b.onclick=()=>choose(x);box.appendChild(b)})}function choose(x){score+=x[1];stats.fans+=x[1]*150;stats.rep+=x[1];stats.conf+=x[2];stats.coach+=x[3];updateStats();eventIndex++;if(eventIndex<events.length)renderEvent();else finish()}function updateStats(){for(const k of ['fans','rep','conf','coach'])document.getElementById(k).textContent=stats[k].toLocaleString('fr-FR')}function finish(){document.getElementById('eventTitle').textContent=score>=14?'🏆 Victoire !':'😬 Fin du match';document.getElementById('eventText').textContent='Score de performance : '+score+'. Les journalistes arrivent pour ton interview.';document.getElementById('choices').innerHTML='';document.getElementById('interview').classList.remove('hidden');document.getElementById('question').textContent='« Quelle est ta réaction après ce match ? »';let a=document.getElementById('answers');a.innerHTML='';[['Rendre hommage à l’équipe',8,6],['Assumer le rôle de star',12,2],['Rester humble',6,7]].forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x[0];b.onclick=()=>{stats.rep+=x[1];stats.fans+=x[1]*100;stats.coach+=x[2];updateStats();b.disabled=true;b.textContent='✓ '+x[0]+' (réponse enregistrée)';};a.appendChild(b)})}try{let p=JSON.parse(localStorage.getItem('roadToNFLPlayer'));if(p){document.getElementById('first').value=p.first||'';document.getElementById('last').value=p.last||'';document.getElementById('eth').value=p.eth||document.getElementById('eth').value;document.getElementById('pos').value=p.pos||document.getElementById('pos').value}}catch(e){}</script></body></html>
