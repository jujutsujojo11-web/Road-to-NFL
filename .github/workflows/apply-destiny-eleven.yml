name: Apply Destiny Eleven expansion

on:
  push:
    paths:
      - '.github/workflows/apply-destiny-eleven.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach expansion script
        run: python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); marker='<script src=\"destiny-expansion.js\"></script>'; s=s if marker in s else s.replace('</body>',marker+'</body>'); p.write_text(s,encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: enable Destiny Eleven career expansion' || exit 0
          git push
