<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to NFL - Calendrier</title><style>body{margin:0;background:#07090d;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#121823;border:1px solid #293342;border-radius:18px;padding:20px;margin:14px 0}.btn{display:block;width:100%;padding:14px;margin:9px 0;border:0;border-radius:10px;background:#ff5b22;color:#fff;font-weight:700;font-size:16px;text-decoration:none;text-align:center}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.tab{background:#202936;border:0;color:#fff;padding:12px;border-radius:9px;font-weight:bold}.game{display:flex;align-items:center;gap:12px;background:#090c11;border-radius:12px;padding:14px;margin:9px 0}.badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#202936;font-size:22px}.date{min-width:82px;color:#aeb8c7}.result{margin-left:auto;color:#ffb08f;font-size:12px}.offer{background:#090c11;border:1px solid #293342;border-radius:12px;padding:14px;margin:9px 0}.offer strong{font-size:18px}.pill{display:inline-block;background:#283242;border-radius:20px;padding:5px 9px;font-size:12px;color:#cbd4df}.muted{color:#aeb8c7}@media(max-width:650px){.game{flex-wrap:wrap}.result{margin-left:0}.tabs{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈</h1><div class="card"><h2>📅 Calendrier de carrière</h2><p id="intro" class="muted"></p><div class="tabs"><button class="tab" onclick="showSchedule('lycee')">🏫 Lycée</button><button class="tab" onclick="showSchedule('universite')">🎓 Université</button><button class="tab" onclick="showSchedule('nfl')">🏈 NFL</button></div><div id="schedule"></div></div><div class="card"><h2>🎓 Mes offres universitaires</h2><p class="muted">À 18 ans, les offres que tu as réellement gagnées apparaissent ici.</p><div id="offers"></div></div><a class="btn" href="./index.html">← Retour à Road to NFL</a></main><script>const p=new URLSearchParams(location.search),age=+p.get('age')||16,rep=+p.get('rep')||50,coach=+p.get('coach')||60,school=p.get('school')||'Lincoln High School',player=p.get('player')||'Ton joueur';const nfl=['Arizona Cardinals','Atlanta Falcons','Baltimore Ravens','Buffalo Bills','Carolina Panthers','Chicago Bears','Cincinnati Bengals','Cleveland Browns','Dallas Cowboys','Denver Broncos','Detroit Lions','Green Bay Packers','Houston Texans','Indianapolis Colts','Jacksonville Jaguars','Kansas City Chiefs','Las Vegas Raiders','Los Angeles Chargers','Los Angeles Rams','Miami Dolphins','Minnesota Vikings','New England Patriots','New Orleans Saints','New York Giants','New York Jets','Philadelphia Eagles','Pittsburgh Steelers','San Francisco 49ers','Seattle Seahawks','Tampa Bay Buccaneers','Tennessee Titans','Washington Commanders'];const colleges=['Alabama','Auburn','Clemson','Florida','Florida State','Georgia','LSU','Miami','Michigan','Michigan State','Notre Dame','Ohio State','Oklahoma','Oregon','Penn State','Texas','Texas A&M','Texas Tech','USC','UCLA','Utah','Washington','Wisconsin','Iowa','Iowa State','Nebraska','Oklahoma State','Tennessee','Ole Miss','Mississippi State','Arkansas','Kentucky','Louisville','North Carolina','NC State','Virginia Tech','Virginia','Duke','Stanford','California','Arizona','Arizona State','Colorado','Kansas','Kansas State','Baylor','TCU','West Virginia','Pittsburgh','Syracuse'];const high=['Westside High School','Central High School','Eastview High School','Northside High School','Roosevelt High School','Lincoln High School','Washington High School','Jefferson High School','Riverside High School','Southside High School','Oak Ridge High School','Liberty High School'];const $=id=>document.getElementById(id);function card(d,o,t){return '<div class="game"><span class="date">'+d+'</span><span class="badge">'+(t==='NFL'?'🏈':t==='NCAA'?'🎓':'🏫')+'</span><div><b>'+o+'</b><br><span class="pill">'+t+'</span></div><span class="result">À jouer</span></div>'}function showSchedule(t){let h='';if(t==='lycee'){h=age>=18?'<p class="muted">Ton parcours lycée est terminé.</p>':high.sort(()=>Math.random()-.5).slice(0,8).map((x,i)=>card('S'+(i+1),x,'Lycée')).join('')}else if(t==='universite'){h=age<18?'<p class="muted">Tu dois atteindre 18 ans pour jouer au niveau universitaire.</p>':colleges.sort(()=>Math.random()-.5).slice(0,12).map((x,i)=>card('W'+(i+1),x,'NCAA')).join('')}else{h=age<21?'<p class="muted">La NFL viendra après le lycée/université et la Draft.</p>':nfl.sort(()=>Math.random()-.5).slice(0,17).map((x,i)=>card('W'+(i+1),x,'NFL')).join('')}$('schedule').innerHTML=h}function renderOffers(){if(age<18){$('offers').innerHTML='<p>🔒 Tu as '+age+' ans. Les offres seront révélées à tes 18 ans.</p>';return}let count=Math.max(0,Math.min(8,Math.floor((rep-45)/12)+(coach>=75?2:0)));let arr=colleges.sort(()=>Math.random()-.5).slice(0,count);$('offers').innerHTML=arr.length?arr.map(x=>'<div class="offer"><strong>🎓 '+x+'</strong><p>Offre reçue grâce à ton niveau et ta réputation.</p><span class="pill">Offre reçue</span></div>').join(''):'<p>Aucune offre pour le moment.</p>'}$('intro').textContent=player+' · '+school+' · '+age+' ans · Réputation '+rep+' · Coach '+coach;renderOffers();showSchedule(age<18?'lycee':age<21?'universite':'nfl');</script></body></html>
