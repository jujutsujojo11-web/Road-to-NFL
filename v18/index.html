<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to NFL V18</title><style>body{margin:0;background:#07090d;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:16px}.card{background:#121823;border:1px solid #293342;border-radius:18px;padding:18px;margin:12px 0}.hidden{display:none!important}input,select{width:100%;padding:12px;box-sizing:border-box;margin:6px 0;border-radius:8px;border:1px solid #334052;background:#0a0e14;color:white}.btn,.choice{width:100%;padding:13px;margin:6px 0;border:0;border-radius:10px;background:#ff5b22;color:white;font-weight:700;cursor:pointer}.choice{background:#202936;text-align:left}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#090c11;padding:10px;border-radius:10px}.good,.bad{padding:14px;border-radius:10px;margin:10px 0}.good{background:#123b24;color:#baffce}.bad{background:#40171b;color:#ffb0b8}.tag{display:inline-block;padding:5px 8px;border-radius:15px;background:#293342;font-size:12px}.bar{height:9px;background:#28303c;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#ff5b22}.offer,.game{background:#090c11;border-radius:10px;padding:12px;margin:7px 0}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><h1>ROAD <span style="color:#ff5b22">TO</span> NFL 🏈 <small>V18</small></h1><section id="creator" class="card"><h2>Créer ton joueur</h2><input id="first" placeholder="Prénom"><input id="last" placeholder="Nom"><label>Taille <b id="hv">1,80 m</b></label><input id="height" type="range" min="170" max="200" value="180"><label>Poids <b id="wv">85 kg</b></label><input id="weight" type="range" min="60" max="150" value="85"><select id="position"><option>Quarterback</option><option>Running Back</option><option>Wide Receiver</option><option>Cornerback</option><option>Linebacker</option><option>Defensive End</option><option>Offensive Lineman</option><option>Kicker</option></select><input id="city" placeholder="Ville"><input id="school" placeholder="Lycée"><select id="origin"><option>Quartier</option><option>Famille sportive</option><option>Académie</option><option>Football de rue</option></select><button type="button" id="start" class="btn">Valider mon joueur</button><div id="err" class="bad hidden"></div></section><section id="career" class="hidden"><div class="card"><h2 id="player"></h2><p id="mini"></p><button type="button" id="toggleStats" class="choice">📊 Voir mes statistiques</button><div id="statsBox" class="hidden"><div id="statGrid" class="stats"></div><p>Fatigue</p><div class="bar"><i id="fat"></i></div><p id="coachNote"></p></div></div><div class="card"><h2>Carrière · Vie privée</h2><p id="date"></p><p id="status"></p><div class="grid"><button type="button" id="training" class="choice">🏋️ Entraînement</button><button type="button" id="life" class="choice">🎲 Événement</button><button type="button" id="match" class="choice">🏈 Match</button><button type="button" id="gear" class="choice">👟 Équipement</button><button type="button" id="offers" class="choice">🎓 Offres universitaires</button><button type="button" id="calendar" class="choice">📅 Calendrier</button><button type="button" id="next" class="btn">+1 MOIS</button></div><div id="panel"></div></div></section></main><script>const $=id=>document.getElementById(id);const LIFE_EVENTS=[['🏫 Lycée','Un professeur te demande de rattraper un devoir avant le prochain match.','Faire le devoir','Le repousser'],['🏈 Coach','Ton coach te propose une séance vidéo supplémentaire.','Accepter','Refuser'],['📱 Réseaux','Un clip de toi devient viral après un gros match.','Répondre aux fans','Ne rien poster'],['🩹 Corps','Une petite douleur apparaît après une séance.','Te reposer','Forcer'],['🎓 Recruteur','Un recruteur universitaire observe ton entraînement.','Rester naturel','Forcer pour impressionner'],['🎙️ Journaliste','Un journaliste te demande qui est ton modèle.','Répondre sincèrement','Jouer un personnage'],['🎮 Ami','Un ami veut jouer toute la nuit avant un match.','Jouer raisonnablement','Jouer toute la nuit'],['🍔 Alimentation','Tu hésites entre un repas équilibré et un fast-food après l’entraînement.','Manger équilibré','Prendre le fast-food'],['📸 Média','Une chaîne locale veut filmer ton quotidien.','Accepter avec des limites','Tout montrer'],['💰 Sponsor','Une petite marque veut te sponsoriser mais demande beaucoup de publications.','Négocier','Accepter tout de suite'],['🏫 Notes','Tes notes baissent avec les entraînements.','Réorganiser ton planning','Ignorer'],['🧑‍🤝‍🧑 Équipe','Un nouveau joueur cherche sa place dans le groupe.','L’accueillir','L’ignorer'],['🏆 Tournoi','Un tournoi régional attire des recruteurs.','Gérer ton énergie','Tout donner sans réfléchir'],['🎤 Rappeur','Un rappeur connu mentionne ton parcours dans une chanson.','Le remercier','Ne rien faire'],['⭐ Streamer','Un streamer connu t’invite dans son live.','Accepter','Refuser'],['📄 Contrat','On te propose un contrat que tu ne comprends pas.','Demander conseil','Signer immédiatement'],['🚌 Transport','Ton bus est en retard avant l’entraînement.','Prévenir le coach','Ne rien dire'],['🧠 Pression','Des recruteurs seront dans les tribunes.','Jouer ton jeu','Chercher à impressionner à chaque action'],['🏈 Position','Le coach pense que tu pourrais tester une autre position.','Essayer','Refuser immédiatement'],['🩺 Prévention','Le staff organise une séance de prévention des blessures.','Participer','Sécher']];const MATCH_EVENTS=[['🏈 Drive','La défense adverse vient de changer sa couverture.','Lire la défense','Forcer la passe profonde'],['🔥 Pression','Le pass rush arrive très vite.','Prendre une décision rapide','Garder le ballon trop longtemps'],['📣 Public','Le stade devient extrêmement bruyant sur un troisième down.','Rester concentré','Regarder les tribunes'],['🩹 Contact','Tu prends un gros contact mais peux continuer.','Jouer plus prudemment','Chercher un nouveau gros contact'],['⏱️ Horloge','Il reste moins d’une minute et ton équipe est menée.','Gérer l’horloge','Prendre tout ton temps'],['🎯 Cible','Ton receveur préféré est couvert mais un autre est libre.','Changer de cible','Lancer quand même'],['🌧️ Météo','Une forte pluie commence pendant le drive.','Sécuriser le ballon','Tenter une passe très risquée'],['🏃 Course','Un espace s’ouvre au milieu.','Prendre les yards disponibles','Chercher une action spectaculaire'],['📺 Caméras','Les caméras montrent ton visage après une erreur.','Passer à l’action suivante','T’énerver'],['🧤 Réception','Ton receveur a les mains froides.','Lui donner une cible facile','Tenter une passe difficile'],['🧠 Coach','Le coach te donne un changement de jeu juste avant le snap.','Écouter et exécuter','Ignorer l’appel'],['🏆 Rival','Un défenseur te provoque après une action.','Ignorer','Répondre'],['⭐ Scout','Tu aperçois un scout qui prend des notes.','Jouer normalement','Forcer une action'],['💨 Fatigue','Tes jambes deviennent lourdes en fin de match.','Simplifier ton jeu','Continuer à prendre tous les risques'],['🏈 4e tentative','Ton équipe doit choisir entre tenter la quatrième tentative ou dégager.','Faire confiance au plan','Prendre une décision héroïque']];const teams=['Alabama','Georgia','Ohio State','Michigan','Oregon','Texas','USC','LSU','Notre Dame','Clemson','Florida','Penn State','Miami','Tennessee','Washington'];const nfl=['Arizona Cardinals','Atlanta Falcons','Baltimore Ravens','Buffalo Bills','Carolina Panthers','Chicago Bears','Cincinnati Bengals','Cleveland Browns','Dallas Cowboys','Denver Broncos','Detroit Lions','Green Bay Packers','Houston Texans','Indianapolis Colts','Jacksonville Jaguars','Kansas City Chiefs','Las Vegas Raiders','Los Angeles Chargers','Los Angeles Rams','Miami Dolphins','Minnesota Vikings','New England Patriots','New Orleans Saints','New York Giants','New York Jets','Philadelphia Eagles','Pittsburgh Steelers','San Francisco 49ers','Seattle Seahawks','Tampa Bay Buccaneers','Tennessee Titans','Washington Commanders'];let p=null,usedLife=new Set(),usedMatch=new Set();function createPlayer(d){const stats={Force:55,Vitesse:55,Accélération:55,Agilité:55,Endurance:55,Footwork:55,Lancer:55,Réception:55,Placages:55,'Lecture du jeu':55};const ideals={'Quarterback':185,'Running Back':178,'Wide Receiver':183,'Cornerback':180,'Linebacker':188,'Defensive End':193,'Offensive Lineman':193,'Kicker':180};return {...d,age:16,month:1,fatigue:0,form:75,moral:70,confidence:60,reputation:20,fans:500,coach:Math.abs(d.height-(ideals[d.position]||183))<=5?68:52,potential:75,overall:55,relationship:null,stats}}function train(skill,gain,fatigue){p.stats[skill]=Math.min(99,p.stats[skill]+gain);p.overall=Math.round(Object.values(p.stats).reduce((a,b)=>a+b,0)/10);p.fatigue=Math.min(100,p.fatigue+fatigue);p.form=Math.max(25,p.form-2)}function advance(){p.month++;p.fatigue=Math.max(0,p.fatigue-15);p.form=Math.min(100,p.form+6);if(p.month>12){p.month=1;p.age++}}function pick(pool,used){let a=pool.map((_,i)=>i).filter(i=>!used.has(i));if(!a.length){used.clear();a=pool.map((_,i)=>i)}const i=a[Math.floor(Math.random()*a.length)];used.add(i);return pool[i]}function render(){$('player').textContent=p.first+' '+p.last;$('mini').textContent=(p.height/100).toFixed(2).replace('.',',')+' m · '+p.weight+' kg · '+p.position;$('date').textContent='Âge '+p.age+' ans · Mois '+p.month;$('status').textContent='Fatigue '+p.fatigue+'/100 · Forme '+p.form+'/100 · Overall '+p.overall;$('fat').style.width=p.fatigue+'%';$('coachNote').textContent='Coach: '+p.coach+' · Potentiel: '+p.potential;$('statGrid').innerHTML=Object.entries(p.stats).map(([k,v])=>'<div class="stat">'+k+'<br><b>'+v+'</b></div>').join('')}function result(ok,title,text){$('panel').innerHTML='<span class="tag">'+(ok?'CHOIX POSITIF':'CHOIX NÉGATIF')+'</span><h3>'+title+'</h3><div class="'+(ok?'good':'bad')+'"><b>'+(ok?'✓ Bon choix':'✕ Mauvais choix')+'</b><br>'+text+'</div><button type="button" class="btn" id="close">Continuer</button>';$('close').onclick=()=>{$('panel').innerHTML='';render()};render()}function start(){try{p=createPlayer({first:$('first').value.trim()||'Jayden',last:$('last').value.trim()||'Carter',height:Number($('height').value),weight:Number($('weight').value),position:$('position').value,city:$('city').value.trim()||'New York',school:$('school').value.trim()||'Lincoln High School',origin:$('origin').value});$('creator').classList.add('hidden');$('career').classList.remove('hidden');render()}catch(e){$('err').textContent='Erreur de lancement : '+e.message;$('err').classList.remove('hidden')}}$('height').oninput=e=>$('hv').textContent=(Number(e.target.value)/100).toFixed(2).replace('.',',')+' m';$('weight').oninput=e=>$('wv').textContent=e.target.value+' kg';$('start').onclick=start;$('toggleStats').onclick=()=>{$('statsBox').classList.toggle('hidden')};$('training').onclick=()=>{$('panel').innerHTML='<h3>🏋️ Choisis ton entraînement</h3>'+[['💪 Musculation','Force',4,10],['🫀 Cardio','Endurance',4,7],['🏃 Tapis de course','Vitesse',3,6],['🏈 Exercices de lancer','Lancer',5,8],['👟 Footwork','Footwork',4,6],['⚡ Agilité','Agilité',4,7],['🎥 Analyse vidéo','Lecture du jeu',4,3],['👐 Réception','Réception',5,7],['🛡️ Placages','Placages',4,8],['💨 Vitesse','Vitesse',5,8]].map((x,i)=>'<button type="button" class="choice tr" data-i="'+i+'">'+x[0]+'</button>').join('');document.querySelectorAll('.tr').forEach(b=>b.onclick=()=>{const x=[['💪 Musculation','Force',4,10],['🫀 Cardio','Endurance',4,7],['🏃 Tapis de course','Vitesse',3,6],['🏈 Exercices de lancer','Lancer',5,8],['👟 Footwork','Footwork',4,6],['⚡ Agilité','Agilité',4,7],['🎥 Analyse vidéo','Lecture du jeu',4,3],['👐 Réception','Réception',5,7],['🛡️ Placages','Placages',4,8],['💨 Vitesse','Vitesse',5,8]][Number(b.dataset.i)];train(x[1],x[2],x[3]);result(true,x[0],x[1]+' +'+x[2]+' · fatigue +'+x[3])})};$('life').onclick=()=>{const e=pick(LIFE_EVENTS,usedLife);$('panel').innerHTML='<h3>'+e[0]+'</h3><p>'+e[1]+'</p><button type="button" class="choice a">'+e[2]+'</button><button type="button" class="choice a">'+e[3]+'</button>';document.querySelectorAll('.a').forEach((b,i)=>b.onclick=()=>{if(i===0){p.reputation+=2;p.confidence+=2;result(true,e[0],e[2]+' : ta décision améliore ton image et ta confiance.')}else{p.reputation=Math.max(0,p.reputation-2);p.confidence=Math.max(0,p.confidence-2);result(false,e[0],e[3]+' : cette décision te coûte un peu en réputation ou confiance.')}})};$('match').onclick=()=>{let count=0;function next(){if(count>=3){result(true,'Fin du match','Trois situations ont influencé ton match.');return}const e=pick(MATCH_EVENTS,usedMatch);$('panel').innerHTML='<h3>'+e[0]+'</h3><p>'+e[1]+'</p><button type="button" class="choice m">'+e[2]+'</button><button type="button" class="choice m">'+e[3]+'</button>';document.querySelectorAll('.m').forEach((b,i)=>b.onclick=()=>{if(i===0){p.reputation+=2;p.confidence+=1}else{p.confidence=Math.max(0,p.confidence-2);p.fatigue=Math.min(100,p.fatigue+4)}count++;next()})}next()};$('offers').onclick=()=>{if(p.age<18){$('panel').innerHTML='<div class="bad">🔒 Les offres universitaires seront visibles à 18 ans.</div>'}else{let n=Math.min(8,Math.max(1,Math.floor(p.reputation/15)));$('panel').innerHTML='<h3>🎓 Tes offres</h3>'+teams.slice(0,n).map((x,i)=>'<div class="offer"><b>'+x+'</b><br>Offre '+(i<3?'⭐ Forte':'🟢')+'</div>').join('')}};$('calendar').onclick=()=>{let arr=p.age<18?Array.from({length:8},(_,i)=>'🏫 Semaine '+(i+1)+' · '+['Lincoln','Central','Westside','Eastview'][i%4]+' High'):p.age<21?Array.from({length:12},(_,i)=>'🎓 Semaine '+(i+1)+' · '+teams[i%teams.length]):nfl.slice(0,17).map((x,i)=>'🏈 Semaine '+(i+1)+' · '+x);$('panel').innerHTML='<h3>📅 Calendrier</h3>'+arr.map(x=>'<div class="game">'+x+'</div>').join('')};$('next').onclick=()=>{advance();render();result(true,'Nouveau mois','Ta carrière avance. Les événements futurs dépendent de ton âge, de tes statistiques, de ta forme et de tes choix.')};$('gear').onclick=()=>{$('panel').innerHTML='<h3>👟 Équipement</h3><div class="offer">🪖 Riddell SpeedFlex</div><div class="offer">🪖 Schutt F7 AiR</div><div class="offer">👟 Nike Alpha Menace</div><div class="offer">👟 adidas Adizero</div><div class="offer">🧤 Nike Vapor Jet</div><div class="offer">🧤 Cutters REV PRO</div><div class="offer">🛡️ Douglas</div><div class="offer">🏈 Wilson</div>'};</script></body></html>
