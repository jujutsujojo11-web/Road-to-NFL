<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Road to NFL HOF - Complete Edition</title>
<style>:root{--bg:#0b0f19;--card:#151f32;--blue:#2563eb;--gold:#f59e0b;--text:#f8fafc;--muted:#94a3b8}*{box-sizing:border-box}body{font-family:Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px;display:flex;justify-content:center}.container{max-width:900px;width:100%}.card{background:var(--card);border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 4px 12px #0006;border:1px solid #1e293b}h1,h2,h3{color:#fff;margin-top:0}.highlight{color:#38bdf8}.header-team{display:flex;align-items:center;gap:15px;margin-bottom:20px}.team-logo{width:70px;height:70px;object-fit:contain}.form-grid,.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:15px 0}.form-group{display:flex;flex-direction:column;gap:5px}input,select{background:#0f172a;color:#fff;border:1px solid #334155;padding:10px;border-radius:6px}button{background:var(--blue);color:#fff;border:0;padding:12px 20px;border-radius:8px;font-size:1em;font-weight:600;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#475569}button.draft-btn{background:var(--gold);color:#000}.stat-box{background:#0f172a;padding:12px;border-radius:8px;text-align:center;border:1px solid #334155}.stat-val{font-size:1.4em;font-weight:bold;color:#38bdf8}.stat-label{font-size:.8em;color:var(--muted)}.log-list{max-height:220px;overflow:auto;background:#090d16;padding:12px;border-radius:8px}.log-item{margin-bottom:8px;border-bottom:1px solid #1e293b;padding-bottom:5px}.event-card{background:#0f172a;border-left:4px solid var(--gold);padding:15px;margin:15px 0;border-radius:4px}.opt-btn{width:100%;text-align:left;background:#334155}.error{background:#7f1d1d;padding:12px;border-radius:8px;margin-top:12px;display:none}</style>
</head><body><div class="container"><h1>ROAD TO <span class="highlight">NFL</span> HOF 🏈</h1>
<div id="error" class="error"></div>
<section id="creation-screen" class="card"><h2>Créer ton Prospect</h2><div class="form-grid"><div class="form-group"><label>Nom</label><input id="player-name" value="Travis Hunter Jr"></div><div class="form-group"><label>Poste</label><select id="player-pos"><option>QB</option><option>RB</option><option>WR</option><option>CB</option><option>DE</option></select></div><div class="form-group"><label>Taille (cm)</label><input id="player-height" type="number" min="170" max="200" value="188"></div><div class="form-group"><label>Poids (kg)</label><input id="player-weight" type="number" min="55" max="160" value="95"></div><div class="form-group"><label>Ethnie / Origine</label><select id="player-ethnicity"><option>Afro-Américain</option><option>Caucasien</option><option>Hispanique</option><option>Samoan / Îles du Pacifique</option><option>Métis</option></select></div></div><button id="start-btn">Rejoindre l'Université (NCAA)</button></section>
<section id="draft-screen" class="card" style="display:none"><h2>NFL Scouting Combine & Draft 🎓</h2><p id="player-summary"></p><div class="stats-grid"><div class="stat-box"><div id="draft-ovr" class="stat-val">68</div><div class="stat-label">Cote NCAA</div></div><div class="stat-box"><div id="draft-proj" class="stat-val">Indéterminé</div><div class="stat-label">Projection</div></div></div><p id="combine-results">Réalise les tests physiques pour impressionner les recruteurs.</p><button id="combine-btn">Passer le NFL Combine ⏱️</button><button id="enter-draft-btn" class="draft-btn" style="display:none">Participer à la NFL Draft 📺</button></section>
<section id="game-screen" class="card" style="display:none"><div class="header-team"><img id="team-logo" class="team-logo" alt="Logo NFL"><div><h2 id="display-name">--</h2><p id="display-team">--</p><p id="display-sponsor" style="color:var(--gold)">Sponsor : Aucun</p></div></div><div class="stats-grid"><div class="stat-box"><div id="stat-age" class="stat-val">21</div><div class="stat-label">Âge</div></div><div class="stat-box"><div id="stat-ovr" class="stat-val">68</div><div class="stat-label">OVR</div></div><div class="stat-box"><div id="stat-rings" class="stat-val">0</div><div class="stat-label">Super Bowls</div></div><div class="stat-box"><div id="stat-mvp" class="stat-val">0</div><div class="stat-label">MVP</div></div></div><div id="stats-career" class="stats-grid"></div><h3>Vestiaire & Équipement 👟</h3><div class="form-grid"><div class="form-group"><label>Casque / Visière</label><select id="eq-helmet"></select></div><div class="form-group"><label>Crampons</label><select id="eq-cleats"></select></div><div class="form-group"><label>Gants</label><select id="eq-gloves"></select></div></div><div id="event-zone" class="event-card" style="display:none"><h3 id="event-title"></h3><p id="event-desc"></p><div id="event-options"></div></div><button id="season-btn">Simuler la Saison NFL 🏈</button><button class="secondary" id="save-btn">Sauvegarder JSON 💾</button><h3>Historique de Carrière</h3><div id="career-log" class="log-list"></div></section></div>
<script>
'use strict';
const TEAMS=[['Arizona Cardinals','ARI'],['Atlanta Falcons','ATL'],['Baltimore Ravens','BAL'],['Buffalo Bills','BUF'],['Carolina Panthers','CAR'],['Chicago Bears','CHI'],['Cincinnati Bengals','CIN'],['Cleveland Browns','CLE'],['Dallas Cowboys','DAL'],['Denver Broncos','DEN'],['Detroit Lions','DET'],['Green Bay Packers','GB'],['Houston Texans','HOU'],['Indianapolis Colts','IND'],['Jacksonville Jaguars','JAX'],['Kansas City Chiefs','KC'],['Las Vegas Raiders','LV'],['Los Angeles Chargers','LAC'],['Los Angeles Rams','LAR'],['Miami Dolphins','MIA'],['Minnesota Vikings','MIN'],['New England Patriots','NE'],['New Orleans Saints','NO'],['New York Giants','NYG'],['New York Jets','NYJ'],['Philadelphia Eagles','PHI'],['Pittsburgh Steelers','PIT'],['San Francisco 49ers','SF'],['Seattle Seahawks','SEA'],['Tampa Bay Buccaneers','TB'],['Tennessee Titans','TEN'],['Washington Commanders','WAS']].map(x=>({name:x[0],code:x[1],logo:`https://a.espncdn.com/i/teamlogos/nfl/500/${x[1].toLowerCase()}.png`}));
const CATALOGUE={helmets:[['Riddell SpeedFlex Custom','Riddell'],['Nike Vapor Shield Visor','Nike'],['Oakley Pro Tint Visor','Oakley'],['Under Armour ArmourSight','Under Armour']],cleats:[['Nike Vapor Edge Pro','Nike'],['Adidas Adizero 12.0','Adidas'],['Under Armour Highlight','Under Armour']],gloves:[['Nike Vapor Jet 7.0','Nike'],['Adidas Adizero 11 Gloves','Adidas'],['Under Armour Spotlight','Under Armour']]};
const EVENTS=[
['Proposition de sponsoring 📝','Une grande marque remarque tes performances et veut faire de toi son ambassadeur.',s=>!s.sponsor&&s.ovr>=75,[['Signer chez Nike (+2 OVR)','Nike',s=>{s.sponsor='Nike';s.ovr+=2}],['Signer chez Adidas (+2 OVR)','Adidas',s=>{s.sponsor='Adidas';s.ovr+=2}],['Refuser et rester libre','Aucun',s=>{}]]],
['Programme intensif 🏋️','Ton coach propose une préparation très exigeante.',s=>true,[['Pousser les limites (+3 OVR)','',s=>{s.ovr+=3}],['Récupération et tactique (+1 OVR)','',s=>{s.ovr+=1}]]],
['Tension au vestiaire 🤬','Un vétéran critique publiquement tes dernières performances.',s=>s.age>22,[['Répondre sur le terrain (+200 yards)','',s=>{s.stats.yards+=200}],['Réunion d’équipe (-1 OVR)','',s=>{s.ovr=Math.max(50,s.ovr-1)}]]],
['Invitation média 🎙️','Un grand média veut t’interviewer avant un match important.',s=>s.ovr>=80,[['Accepter et gagner en visibilité','',s=>{s.popularity=(s.popularity||0)+5}],['Décliner et travailler (+1 OVR)','',s=>{s.ovr+=1}]]]
];
let state={name:'',pos:'QB',height:188,weight:95,ethnicity:'',age:21,ovr:68,team:null,draftPick:null,sponsor:null,popularity:0,equipment:{helmet:'',cleats:'',gloves:''},rings:0,mvps:0,isRetired:false,stats:{yards:0,tds:0},history:[]};
const $=id=>document.getElementById(id); const rand=n=>Math.floor(Math.random()*n);
function fail(e){console.error(e);$('error').style.display='block';$('error').textContent='Erreur du jeu : '+(e.message||e);}
function startCollege(){try{state.name=$('player-name').value.trim()||'Prospect';state.pos=$('player-pos').value;state.height=+$('player-height').value;state.weight=+$('player-weight').value;state.ethnicity=$('player-ethnicity').value;if(state.height<170||state.height>200)throw Error('La taille doit être comprise entre 170 et 200 cm.');state.ovr=65+rand(10);$('creation-screen').style.display='none';$('draft-screen').style.display='block';$('player-summary').textContent=`${state.name} | ${state.pos} | ${state.height} cm, ${state.weight} kg | ${state.ethnicity}`;$('draft-ovr').textContent=state.ovr;projection()}catch(e){fail(e)}}
function projection(){state.ovr>=74?$('draft-proj').textContent='1er Tour (Top 10)':state.ovr>=70?$('draft-proj').textContent='1er - 2ème Tour':$('draft-proj').textContent='3ème Tour ou +'}
function combine(){try{let boost=rand(6)-1;state.ovr=Math.max(50,state.ovr+boost);$('combine-results').innerHTML=`📈 Impact Combine : <b>${boost>=0?'+':''}${boost} OVR</b> (nouveau OVR : <b>${state.ovr}</b>)`;projection();$('combine-btn').style.display='none';$('enter-draft-btn').style.display='inline-block'}catch(e){fail(e)}}
function draft(){try{state.team=TEAMS[rand(TEAMS.length)];let round=state.ovr>=74?1:state.ovr>=70?(Math.random()<.5?1:2):rand(3)+3;state.draftPick=`Ronde ${round}, Choix #${rand(32)+1}`;state.history.unshift(`🎯 <b>DRAFT :</b> ${state.name} sélectionné par les <b>${state.team.name}</b> (${state.draftPick}).`);$('draft-screen').style.display='none';$('game-screen').style.display='block';populate();update()}catch(e){fail(e)}}
function populate(){for(const type of ['helmets','cleats','gloves']){const id=type==='helmets'?'helmet':type;const el=$('eq-'+id);el.innerHTML='';CATALOGUE[type].forEach(([name,brand])=>{if(!state.sponsor||brand===state.sponsor||brand==='Oakley'||brand==='Riddell'){const o=document.createElement('option');o.value=name;o.textContent=`[${brand}] ${name}`;el.appendChild(o)}})}updateEquipment()}
function updateEquipment(){state.equipment.helmet=$('eq-helmet').value;state.equipment.cleats=$('eq-cleats').value;state.equipment.gloves=$('eq-gloves').value}
function season(){try{if(state.isRetired)return alert('Carrière terminée !');let available=EVENTS.filter(e=>e[2](state));if(available.length){let e=available[rand(available.length)];$('event-zone').style.display='block';$('event-title').textContent=e[0];$('event-desc').textContent=e[1];let box=$('event-options');box.innerHTML='';e[3].forEach(o=>{let b=document.createElement('button');b.className='opt-btn';b.textContent=o[0];b.onclick=()=>{try{o[2](state);$('event-zone').style.display='none';populate();playSeason()}catch(x){fail(x)}};box.appendChild(b)})}else playSeason()}catch(e){fail(e)}}
function playSeason(){state.age++;let growth=state.age<=28?rand(4)+1:-(rand(4)+1);state.ovr=Math.max(50,Math.min(99,state.ovr+growth));let qb=state.pos==='QB',yards=Math.floor(state.ovr/99*(qb?4500:1300)+Math.random()*300),td=Math.floor(state.ovr/99*(qb?35:12)+Math.random()*4);state.stats.yards+=yards;state.stats.tds+=td;let sb=state.ovr>82&&Math.random()<.2,mvp=state.ovr>88&&Math.random()<.15;if(sb)state.rings++;if(mvp)state.mvps++;let log=`Saison (${state.age} ans) : ${yards} yards, ${td} TD, OVR ${state.ovr}`;if(sb)log+=' 🏆 SUPER BOWL';if(mvp)log+=' ⭐ MVP';state.history.unshift(log);if(state.age>=36||state.ovr<60){state.isRetired=true;state.history.unshift(`📜 <b>RETRAITE :</b> ${state.rings*30+state.mvps*40+state.stats.yards/1000>90?'🥇 HALL OF FAME !':'Carrière terminée.'}`)}update()}
function update(){if(!state.team)return;$('display-name').textContent=`${state.name} (${state.pos})`;$('display-team').textContent=`${state.team.name} | ${state.height} cm, ${state.weight} kg | ${state.draftPick}`;$('display-sponsor').textContent=state.sponsor?`Sponsor officiel : ${state.sponsor}`:'Sponsor : Aucun (équipementier libre)';$('team-logo').src=state.team.logo;$('stat-age').textContent=state.age;$('stat-ovr').textContent=state.ovr;$('stat-rings').textContent=state.rings;$('stat-mvp').textContent=state.mvps;$('stats-career').innerHTML=`<div class="stat-box"><div class="stat-val">${state.stats.yards.toLocaleString()}</div><div class="stat-label">Yards totaux</div></div><div class="stat-box"><div class="stat-val">${state.stats.tds}</div><div class="stat-label">Touchdowns</div></div><div class="stat-box"><div class="stat-val">${state.popularity}</div><div class="stat-label">Popularité</div></div>`;$('career-log').innerHTML=state.history.map(x=>`<div class="log-item">${x}</div>`).join('')}
function save(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(state));a.download=`RoadToNFL_${state.name||'save'}.json`;document.body.appendChild(a);a.click();a.remove()}
$('start-btn').addEventListener('click',startCollege);$('combine-btn').addEventListener('click',combine);$('enter-draft-btn').addEventListener('click',draft);$('season-btn').addEventListener('click',season);$('save-btn').addEventListener('click',save);['eq-helmet','eq-cleats','eq-gloves'].forEach(id=>$(id).addEventListener('change',updateEquipment));
window.addEventListener('error',e=>fail(e.error||e.message));
</script></body></html>
